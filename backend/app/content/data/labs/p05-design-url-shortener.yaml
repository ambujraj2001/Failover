slug: design-url-shortener
kind: problem
title: Design a URL shortener
difficulty: easy
day: 5
checkpoint: true
summary: Design TinyURL end to end. A read-heavy redirect path, short-code generation, and a cache that has to survive a restart.
topics: [url-shortener, caching, cache-aside, id-generation, read-heavy, estimation]
company_tags: [Google, Meta, Amazon, Microsoft, Bitly, Uber]
estimated_minutes: 45
incident: "Launch review · 100M new links/month · 5,000 req/s at peak · design due Friday"

brief_beginner: |
  You are building **shrt.ly**, a link shortener. People paste a long, ugly link and get back a
  short one like `shrt.ly/aZ3kQ9`. Later, anyone who opens the short link is sent on to the
  original page. That "sending on" is called a **redirect**.

  Think of it as a cloakroom ticket: you hand in a coat (the long URL), get a small ticket (the
  short code), and anyone holding the ticket can collect the coat. Handing in coats is rare.
  Collecting them happens all day: for every link someone creates, it gets opened about
  **100 times**.

  At launch you expect **5,000 requests per second** at peak. Right now the design is one app
  server talking to one small database, and the database only knows how to find links by their
  internal number (`id`), not by the short code people actually type. Every redirect makes it
  search the whole table.

  Two words you will need. A **cache** is a small, very fast memory that keeps recent answers so
  you do not have to ask the database again. A **load balancer** spreads requests across several
  copies of your app so no single copy is overwhelmed.

  **Your job:** build a design that turns short codes into redirects quickly at 5,000 requests per
  second, stays up when traffic jumps and when the cache restarts, and fits the budget. Then write
  a short design note explaining how codes are generated and stored.

brief_expert: |
  **Functional:** `POST /links {long_url, custom_alias?, expires_at?}` → short code; `GET /:code`
  → 301/302 to the long URL; optional expiry and custom aliases. Analytics are out of scope.

  **Non-functional:** 100M new links/month (~40 writes/s average), 100:1 read:write, 5k rps peak on
  the redirect path, p99 < 80 ms at the edge of our service, 99.9% availability, links retained
  5 years.

  **Scale:** 100M × 12 × 5 = 6B links × ~500 B ≈ 3 TB of rows. Hot set (links clicked this week)
  ≈ 3 GB. Redirects are point lookups on `short_code`; ~10% of requests are static assets for the
  create page.

  The starter is one app instance on a small PostgreSQL that only indexes `id`. Fix the access
  path, scale the stateless tier horizontally, and put a cache-aside tier in front of the
  database. Budget rules out solving it with the largest database. Expect a traffic surge and a
  cache restart in the hidden tests.

glossary:
  - term: Redirect (301 vs 302)
    meaning: The server answers "go to this other address instead". 301 means permanent, so browsers remember it; 302 means temporary, so every click comes back to you (useful if you count clicks).
  - term: Short code
    meaning: The few characters after the slash, like aZ3kQ9. Seven base-62 characters (a-z, A-Z, 0-9) give 62^7 ≈ 3.5 trillion possible codes.
  - term: Cache-aside
    meaning: The app checks the cache first. On a miss it reads the database and stores the answer in the cache for next time.
  - term: Index
    meaning: A sorted lookup structure on a column, like the index at the back of a book. Without one, the database reads every row to find a match.
  - term: Load balancer
    meaning: A front door that spreads incoming requests across several identical app servers.

requirements:
  - p99 latency under 80 ms at 5,000 req/s
  - Error rate under 0.5%
  - Survive a 1.5x traffic surge and a cache restart
  - Stay within $1.90/hr

budget: 1.9
palette: [load_balancer, app_server, database, cache, cdn]

