hints:
  - Run the test. The API is reporting errors, but its CPU is fine. Follow the arrows to the box that is actually overloaded.
  - Open the database settings and compare the column the hot query filters on (the incident line names it) with the list of indexed columns.
  - Add `email` to the database's indexed columns (for example `id, email`). Each lookup goes from a full scan to a single probe. Then check how much headroom is left for a Monday morning rush.

editorial: |
  ### Why it broke
  The hot query filters on `email`, but only `id` is indexed. Without an index PostgreSQL scans the
  table, which in this simulator costs **15×** an indexed lookup and takes ~45 ms instead of ~3 ms.
  About **680 reads/s × 15 = 10,200 units/s**, plus writes, against a medium database that does
  **1,500**. That is nearly **7×** over capacity. API threads sit waiting on the database until they
  run out, so the API refuses requests too. In the starter run **every request fails**.

  ### The fix: index the filter column
  ```sql
  CREATE INDEX CONCURRENTLY users_email_idx ON users (email);
  ```
  Each login becomes a B-tree probe: a few page reads instead of the whole table. The database now
  does about **680 reads + 180 write units ≈ 860 units/s**, around **57%** busy. p99 drops to about
  **57 ms** with no errors, and the bill stays at **$0.50/hr**. (`CONCURRENTLY` builds the index
  without locking writes, which matters on a live table.)

  ### The trap: headroom for bursts
  The hidden test is a Monday-morning rush: 40% more sign-ins for 20 seconds. The database peaks near
  80% busy and p99 rises to about 98 ms, still inside the limit. Had you also shrunk the database to
  save money, this is where it would fall over.

  ### Why not a bigger database?
  An xlarge database (8k qps) still loses against 10k units/s of table scans, and costs more than the
  whole budget. Adding replicas spreads the scans but multiplies the cost and still wastes CPU on
  reading rows you throw away. Indexes are not free either: each one slows writes slightly and uses
  disk, so index the columns your hot queries filter or join on, not every column.

  ### Interview takeaway
  When a database is slow, look at the query plan before the instance size. A missing index turns an
  O(log n) lookup into O(n), and no amount of hardware keeps up with that as the table grows.
