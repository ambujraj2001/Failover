slug: the-missing-index
kind: lab
title: The missing index
difficulty: easy
day: 3
summary: Every login looks a user up by email, and nobody indexed the email column. Add the index instead of buying a bigger database.
topics: [databases, indexes, query-plans, sql]
company_tags: [Stripe, Atlassian]
estimated_minutes: 15
incident: "SEV-1 · logins failing on Tallyhub · PostgreSQL CPU 100% · seq scan on users.email"

brief_beginner: |
  You run **Tallyhub**, an expense-tracking app for small teams. When someone signs in, the API asks
  the database: *"find the user whose email is `sam@example.com`"*. About **800 requests per second**
  hit the API, and most of them involve that lookup.

  The problem: the `users` table is sorted by user **id**, not by **email**. To find one email, the
  database has to read through the table row by row until it finds a match. Each lookup is about
  **15 times** more work than it should be. The database falls hopelessly behind, and nobody can
  sign in.

  Picture a phone book printed in the order people signed up instead of alphabetically. Finding
  "Sam" means reading every page. An **index** is the alphabetical version: a separate, sorted list
  that tells the database exactly where each email lives.

  **Your job:** make the email lookup cheap again so logins work, without paying for a much bigger
  database.

brief_expert: |
  800 rps, 85% reads dominated by `SELECT … FROM users WHERE email = $1`. Only `id` is indexed, so each
  lookup is a sequential scan (~15× the cost of an index probe, ~45 ms base latency). PostgreSQL
  (medium, ~1.5k indexed qps) is asked for ~10k units/s. API threads pile up behind it and the
  whole service returns 5xx.

  A B-tree index on the filter column turns each read into a point lookup. Check the post-fix headroom:
  login traffic is bursty (Monday morning, password-reset emails). Larger instances or replicas on an
  unindexed column cost 2–3× the budget and still burn CPU on scans.

glossary:
  - term: Index
    meaning: A sorted lookup structure for one column. It lets the database jump straight to matching rows instead of reading the whole table.
  - term: Full table scan
    meaning: Reading every row of a table to find the ones that match. Fine for 100 rows, terrible for millions.
  - term: Query
    meaning: A question you ask the database, such as "find the user with this email".
  - term: B-tree
    meaning: The most common kind of database index. It keeps values sorted so a lookup takes a handful of steps even on huge tables.

requirements:
  - p99 latency under 70 ms at 800 req/s
  - Error rate under 0.2%
  - Stay within $0.60/hr (a larger database does not fit)

budget: 0.60
palette: [load_balancer, app_server, database]

