hints:
  - Run the test and look at which box turns red. The API is fine; something behind it is not.
  - The same links are read over and over and rarely change. Where could you keep those answers so the database never sees most of them?
  - Add Redis and connect API → Redis (keep API → PostgreSQL for misses). Give it a long TTL. Then ask yourself what the database sees in the first seconds after Redis restarts, and look at Redis's resilience settings.

editorial: |
  ### Why it broke
  PostgreSQL (medium) does roughly **1,500 indexed lookups per second**. You are sending it about
  **4,000**. Past 100% utilisation a queue forms, every request waits behind the ones before it,
  and latency grows without bound. API threads sit blocked on those slow queries, so the API starts
  refusing requests too, even though its CPU is fine.

  ### The fix: cache-aside
  ```
  GET /r/abc123
    → Redis GET link:abc123        (~1 ms)
       hit  → redirect
       miss → SELECT … FROM links  (~3 ms) → Redis SET link:abc123 (TTL 1 h) → redirect
  ```
  With a 2 GB hot set and 4 GB of Redis, about **97% of reads hit**. The database now sees
  ~120 reads/s plus ~80 writes/s: around 15% busy.

  ### The trap: an empty cache
  When Redis restarts, every request misses at once and all 4,000/s land on a database sized for
  ~200/s. That is a **cache stampede**. *Request coalescing* (one request fetches a key, the
  others wait for it) cuts the miss storm by ~75% while the cache warms up. Other real-world
  options: warm the cache before taking traffic, or keep database headroom for the cold-start case.

  ### Why not just a bigger database?
  An xlarge (8k qps) would survive, but it costs about twice as much, still runs every redirect
  through disk-backed queries, and buys you nothing when traffic doubles again.

  ### Interview takeaway
  For read-heavy, skewed, rarely-changing data: cache-aside, size for the hot set, long TTL with
  explicit invalidation, and a plan for cold starts.
