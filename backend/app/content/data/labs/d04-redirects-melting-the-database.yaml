slug: redirects-melting-the-database
kind: lab
title: Redirects are melting the database
difficulty: easy
day: 4
summary: A read-heavy URL shortener pins PostgreSQL at 100%. Put a cache in front of it.
topics: [caching, cache-aside, redis, read-heavy]
company_tags: [Bitly, TinyURL]
estimated_minutes: 20
incident: "SEV-2 · p99 > 2 s on GET /r/:code · PostgreSQL CPU 100%"

brief_beginner: |
  You run **shrt.ly**, a link shortener. Someone opens `shrt.ly/abc123`, your API looks up
  `abc123` in the database, finds the long URL and redirects them. Simple.

  Today the service handles **4,000 redirects every second**, and almost all of them (98%) are
  people *opening* links, not creating them. Every single open asks PostgreSQL the same kind of
  question: *"where does `abc123` point?"*. The database is answering as fast as it can and
  still falling behind, so people wait seconds for a redirect, and some give up.

  Here is the useful observation: the **same few thousand links get most of the clicks** (a viral
  post, a newsletter). The answers barely ever change. You are asking the database to look up the
  same thing thousands of times a second.

  **Your job:** keep the answers somewhere much faster than the database, so most requests never
  reach it.

brief_expert: |
  Read-dominated workload: 4k rps, 98% `SELECT url FROM links WHERE code = $1` (indexed point
  lookups), heavy Zipf skew, ~2 GB hot set. PostgreSQL (medium, ~1.5k qps) is saturated; queueing
  drives p99 into seconds and app threads exhaust while blocked on it.

  Introduce a cache-aside tier (API → Redis on the read path, API → PostgreSQL retained for misses
  and writes). Size memory for the hot set, keep TTL long enough to hold a high hit ratio, and think
  about what happens to the database the moment that cache is empty. A bigger database does not fit
  the budget.

glossary:
  - term: Cache
    meaning: A small, very fast store (in RAM) that keeps copies of answers you asked for recently.
  - term: Cache-aside
    meaning: The app checks the cache first. On a miss it asks the database, then saves the answer in the cache.
  - term: Hit ratio
    meaning: The share of requests the cache could answer. 95% means only 1 in 20 reaches the database.
  - term: p99 latency
    meaning: 99 out of 100 requests are faster than this. It describes your unluckiest users.

requirements:
  - p99 latency under 80 ms at 4,000 req/s
  - Error rate under 0.2%
  - Stay within $1.45/hr (an xlarge database does not fit)

budget: 1.45
palette: [load_balancer, app_server, database, cache]

