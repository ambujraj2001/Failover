hints:
  - >-
    Run the visible test and read the failure reasons. The API has spare CPU; its threads are stuck
    waiting on PostgreSQL. Three quarters of the traffic asks the same question ("what are the latest
    comments on stream X?"), and the answer is shared by every viewer of that stream. Where should
    that answer live?
  - >-
    Put Redis next to the API (API → Redis and keep API → PostgreSQL for misses). That fixes the
    normal night. Now picture the goal: comment posts double for half a minute. Those writes all land
    on the primary. A queue with a fixed pool of workers turns a spike into a short delay instead of
    an overload, as long as the workers drain slower than the database's limit and faster than the
    average comment rate.
  - >-
    The last hidden test empties Redis while traffic is 60% above normal. Every read misses at once.
    Coalescing (stampede protection) cuts the miss storm, and a read replica gives those misses
    somewhere to go besides the primary that is also absorbing the worker writes. Check that the
    primary stays under ~90% in that moment.

editorial: |
  ### 1. Requirements (5 minutes)
  Pin down: delivery latency target (~2 s is fine, this is not chat), whether every viewer must see
  every comment (no: at 5M viewers nobody can read 1,000 comments a second), ordering (per stream,
  best effort), moderation (deletes must propagate), and whether replays need comments (yes, store
  them durably with a stream offset).

  ### 2. Estimation
  - 20M concurrent viewers, ~100k streams, top stream 5M viewers.
  - Posting: if 1% of a hot stream's viewers comment once a minute, that is 5M × 0.01 / 60 ≈ **830
    comments/s**; after a goal, 5–10x for a few seconds.
  - Naive fan-out on the hot stream: 830 × 5M ≈ **4 billion deliveries/s**. Impossible and useless,
    since a human reads maybe 5–10 comments a second. So the system **samples**: each viewer gets at
    most ~10 comments/s (friends' comments and highly ranked ones first). That is 5M × 10 = 50M
    messages/s for one stream, ~10 GB/s at 200 bytes, served from the edge.
  - Connections: 20M open SSE/WebSocket connections at ~50k per gateway node ≈ **400 gateway nodes**.
  - Storage: 1k comments/s × 300 B ≈ 26 GB/day. Small. The hard part is delivery, not storage.

  ### 3. High-level design
  ```
  post:    client → Comment API → comment log (Kafka, partition by stream_id) → writers → DB
                                                                └→ fan-out service
  deliver: fan-out service → regional pub/sub (per stream channel) → gateway nodes → SSE → viewers
  join:    client → Comment API → Redis "recent:{stream}" (last 50) → DB on miss
  ```
  Gateways keep a local map `stream_id → set(connections)`. Each gateway subscribes once per
  stream it has viewers for, so a comment is published **once per gateway**, not once per viewer.
  For 5M viewers on 100 gateways, one comment becomes 100 pub/sub messages and the gateways do the
  last-mile fan-out in memory.

  ### 4. Deep dives
  - **SSE vs WebSockets vs polling.** Viewers mostly receive; posting is rare and can be a normal
    POST. SSE gives server push over plain HTTP, works through proxies and HTTP/2, and reconnects
    with `Last-Event-ID` so a client can resume from its last offset. WebSockets add two-way framing
    you do not need here and are harder to load-balance. Long polling is the fallback for clients
    behind hostile proxies; it is exactly the "fetch latest since cursor" read in the graded part,
    which is why the cache matters.
  - **Hot streams.** Partition the comment log by `stream_id`, but split a hot stream across several
    partitions (or salt the key) so one stream does not pin one broker. On the delivery side, a hot
    stream is fine: it simply has subscribers on every gateway.
  - **Bursts.** Accept the post fast (ack after the log write), apply per-user rate limits, and let
    the fan-out service sample and batch (send one frame with 5 comments every 500 ms instead of 5
    frames). Under extreme load, drop low-ranked comments from fan-out but still persist them.
  - **Multi-region.** Viewers connect to the nearest region. A comment is written in the poster's
    region and replicated cross-region on the log (MirrorMaker or equivalent). Each region runs its
    own fan-out and gateways, so the 50M msg/s never crosses an ocean; only the 1k comments/s does.
    Per-stream ordering across regions is best effort (use a hybrid timestamp + region id).
  - **Moderation.** Deletes are events on the same channel; clients hide the comment id. Redis
    "recent" lists are updated by the same writer.

  ### 5. What the hidden tests probe
  - **Goal burst (2x for 30 s).** Without a queue, posts hit the primary directly and it runs at
    ~97%, so p99 climbs past 250 ms. With a queue and two workers draining ~1,500 writes/s, the
    primary stays under 80% and comments are persisted ~8 s late at worst. That delay is the
    trade-off you should name.
  - **Cache restart at peak.** All reads miss at once. Stampede protection collapses duplicate misses
    for the same stream key, and the replica takes half of the remaining reads. Without the replica
    the primary, already carrying worker writes, saturates.

  ### 6. Common mistakes
  - Fanning out per viewer from the API servers (4 billion writes/s on paper).
  - Storing per-viewer inboxes, as in a news feed. Live comments are ephemeral and shared, so fan-out
    on read from a per-stream buffer is the right model.
  - Choosing WebSockets "because real-time" without discussing connection cost, proxies or resume.
  - Forgetting that the hot stream is both a read hot key and a write hot key.

  ### 7. What good looks like
  - **E4:** correct API (`POST /streams/{id}/comments`, `GET /streams/{id}/comments?since=`), a
    cache for recent comments, a push channel, a queue in front of the database.
  - **E5:** gateway tier with per-stream subscriptions, the numbers showing why per-viewer fan-out
    fails, SSE with resume, burst handling via queue and sampling, hot-stream partitioning.
  - **E6:** delivery as a ranked, rate-limited stream per viewer; regional fan-out with only the raw
    comment stream replicated; explicit degradation ladder (sample, batch, drop from fan-out but
    persist); capacity plan for gateways and pub/sub; how to test it (synthetic 5M-viewer load).

design_prompt: |
  Answer each in a few sentences or a short sketch. Use numbers where you can.

  1. **API and delivery protocol.** Define the endpoints for posting a comment and for receiving
     comments on a stream. Choose between SSE, WebSockets and long polling for delivery, and explain
     how a client that reconnects after a network blip resumes without gaps or duplicates.
  2. **Fan-out for a hot stream.** A stream has 5M viewers and receives 1,000 comments/s. Estimate
     the naive fan-out, then describe how your design delivers comments (gateway subscriptions,
     sampling, batching) and how many messages per second each component handles.
  3. **Data model and storage.** What do you store for a comment, how is it keyed and partitioned,
     and what lives in the cache versus the durable store? How does a viewer joining mid-stream get
     the last 50 comments?
  4. **Bursts and backpressure.** Traffic jumps 5–10x for a few seconds after a goal. Walk through
     what happens at each tier, what you degrade first, and what the viewer experiences.
  5. **Multi-region.** Viewers are spread across three continents. Where are comments written, how
     do they reach viewers in other regions, and what ordering guarantee do you offer?
