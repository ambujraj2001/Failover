slug: design-live-comments
kind: problem
title: Design live comments
difficulty: hard
day: 18
summary: Comments on a live stream with millions of viewers. Absorb the read fan-out with a cache, smooth comment bursts with a queue, and keep reads alive when the cache goes cold.
topics: [fan-out, server-sent-events, websockets, hot-keys, caching, message-queue, read-replicas, multi-region]
company_tags: [Facebook Live, YouTube Live, Twitch, TikTok LIVE, LinkedIn]
estimated_minutes: 45
incident: "Launch review · 20M concurrent viewers at peak · design due Friday"

brief_beginner: |
  You are building the comment strip that scrolls next to a **live video**: a football match,
  a concert, a product launch. Viewers type a comment and, a moment later, everyone else watching
  sees it slide in.

  Two things make this hard:

  - **Very few people write, almost everyone reads.** One comment has to reach every viewer of that
    stream. When one stream has millions of viewers, a single comment turns into millions of
    deliveries. Engineers call this **fan-out**.
  - **Traffic is not spread evenly.** One huge stream (the final of a tournament) can attract most of
    the viewers at once. That stream is a **hot key**: one item that gets far more traffic than the
    rest. And when something exciting happens on screen, everyone comments in the same few seconds,
    so traffic suddenly doubles.

  Right now every viewer's request for "the latest comments" goes straight to one PostgreSQL
  database, and so does every new comment. The database cannot keep up even on a normal evening.

  **Your job:** build a comment service that serves the latest comments from somewhere fast, accepts
  new comments without letting a burst knock the database over, and keeps working when the fast
  layer restarts. Then write down how comments actually get pushed to viewers' screens.

brief_expert: |
  **Functional:** post a comment to a live stream; viewers receive new comments for the stream they
  are watching within ~2 s; a joining viewer sees the most recent ~50 comments; basic moderation
  (delete, hide) propagates to viewers.

  **Non-functional:** 20M concurrent viewers at peak across ~100k live streams, Zipf-distributed;
  the top stream can hold 5M viewers (60% of the traffic in this region). Comment rate ~1k/s on a
  hot stream normally, 5–10x for a few seconds after a goal. Delivery p99 under 2 s, post ack p99
  under 200 ms. Ordering per stream is best effort; losing an occasional comment under extreme load
  is acceptable, losing the service is not. Multi-region: viewers are global.

  **Graded part:** one regional comment API at 4,000 req/s, 75% reads (fetch-latest / reconnect
  backfill for a stream, cacheable, ~3 GB hot set), 25% posts. Bursts double traffic for ~30 s.
  Keep the API tier as sized; the budget rules out solving it with one oversized database.

glossary:
  - term: Fan-out
    meaning: One event that has to be delivered to many receivers. One comment, five million viewers.
  - term: Hot key
    meaning: A single item (here, one stream) that receives a large share of all traffic, so whatever stores it gets overloaded first.
  - term: SSE (Server-Sent Events)
    meaning: A long-lived HTTP response the server keeps writing to. Simple one-way push from server to browser.
  - term: WebSocket
    meaning: A long-lived two-way connection between browser and server. More flexible than SSE, more work to run.
  - term: Message queue
    meaning: A durable waiting line. The API drops a comment in and replies at once; background workers save it at a pace the database can handle.

requirements:
  - "Normal evening: p99 under 45 ms, error rate under 0.5% at 4,000 req/s"
  - Comments keep flowing through bursts and cache restarts (hidden tests)
  - Stay within $3.30/hr (the API tier stays at 11 large instances)

