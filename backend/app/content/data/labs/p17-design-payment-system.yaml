slug: design-payment-system
kind: problem
title: Design a payment system
difficulty: hard
day: 17
summary: Design the money-movement core of a Stripe-like processor. A ledger write may never be lost or applied twice, balances may never be stale, and the primary will die.
topics: [payments, ledger, idempotency, outbox, failover, sync-replication, message-queue, reconciliation]
company_tags: [Stripe, PayPal, Amazon, Uber, Square, Adyen, Coinbase, Shopify]
estimated_minutes: 60
incident: "Launch review · 1,500 payments/s at peak · zero tolerance for lost or double charges · design due Friday"

brief_beginner: |
  You are building **Tilly**, the system that moves money when someone pays a shop online. A
  customer taps "Pay", Tilly asks the card network to approve it, records who owes whom, and
  later pays the shop. Getting this wrong has a very real cost: charge someone twice, or lose
  a record of a payment, and real people lose real money.

  Think of a bank's paper ledger. Every movement of money is written as two lines that cancel
  out: "customer −€20" and "shop +€20". This is called **double-entry bookkeeping**. If the lines
  of the whole book do not add up to zero, something went wrong, and you can tell.

  At peak Tilly handles **3,000 requests per second**: half are new payments (writes) and half
  are status and balance checks (reads). Phones lose signal and apps retry, so the same
  payment request can arrive two or three times. Today every payment is written straight into one
  database with no copy. If that database dies, payments fail until someone fixes it by hand.

  Words you will need. An **idempotency key** is a unique ID the client attaches to a request, so
  that if the same request arrives twice the server recognises it and does the work only once.
  **Failover** means a standby copy of the database (a **replica**) automatically takes over
  when the main one (the **primary**) dies. **Synchronous replication** means a write is only
  confirmed once the replica also has it, so no confirmed write can be lost and the replica is
  never behind.

  **Your job:** design a payment backend where no accepted payment is ever lost, a retried request
  never charges twice, balances are never out of date, and the database primary can die without
  customers noticing. Then explain the ledger and the retry safety in writing.

brief_expert: |
  **Functional:** create a payment (authorize → capture), refunds, query payment status and
  merchant balance, payouts to merchants, webhooks to merchants on state changes. Integrates with
  external payment service providers (PSPs) / card networks.

  **Non-functional:** **exactly-once effect** for money movement (at-least-once delivery +
  idempotency), no acknowledged payment lost (RPO = 0), strongly consistent balance reads, error
  rate < 0.05%, API p99 < 150 ms (PSP calls happen asynchronously), 99.99% availability,
  auditability.

  **Scale:** 100M payments/day ≈ 1.2k/s average, **1.5k payment writes/s + 1.5k reads/s** at peak
  (3k rps). Each payment produces ~4 ledger entries over its life; ~10 KB of state and events per
  payment ≈ 1 TB/day. Balance and status reads are not cacheable.

  The starter writes synchronously to one PostgreSQL with no replica. Make acceptance durable and
  decoupled from the ledger's availability, use synchronous replication with automatic failover so
  no confirmed write is lost and no read is stale, and size the ledger writers. Hidden tests kill
  the primary and spike traffic.

glossary:
  - term: Idempotency key
    meaning: A unique ID the client sends with a request (for example a UUID per checkout). The server stores the key with the result; a repeat of the same key returns the stored result instead of charging again.
  - term: Double-entry ledger
    meaning: An append-only record where every money movement is two or more entries that sum to zero (debit one account, credit another). Balances are derived from entries, never edited directly.
  - term: Transactional outbox
    meaning: Writing the business change and an "event to publish" in the same database transaction, then publishing events from that table. The event is published if and only if the change committed.
  - term: Synchronous replication
    meaning: The primary waits until a replica has the write before confirming it. Slightly slower writes, but a replica that takes over has every confirmed write.
  - term: Reconciliation
    meaning: Regularly comparing your ledger against the bank's and PSP's settlement files to find and fix any mismatch.

requirements:
  - p99 latency under 150 ms at 3,000 req/s (50% payment writes)
  - Error rate under 0.05%
  - No lost payments (0% write loss) and no stale balance reads (under 0.1%)
  - Ledger lag under 5 s normally; the primary dying must not lose or reject payments
  - Stay within $3.90/hr

