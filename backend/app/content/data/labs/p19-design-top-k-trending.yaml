hints:
  - >-
    Look at the load split: 5,700 events/s are writes, each costing 1.5 units on the primary, so the
    database sees more than 8,500 units of writes before any reads, and every trending read is an
    unindexed scan. No single database size fixes both. Separate the two paths: events go into a
    durable log and are counted in the background; trending reads come from a precomputed answer.
  - >-
    Add a queue with enough partitions and workers that drain at least as fast as events arrive
    (each large worker handles ~1,500 events/s at this app_work). The counts still need more write
    capacity than one primary has, so shard them. Then ask what happens to the shard that owns the
    hottest hashtag under a hash-by-key scheme.
  - >-
    Use a shard key that splits hot keys (salted counters, summed on read) so the 30% tag spreads
    across every shard. Cache the top-K with a TTL close to your refresh interval and turn on
    stampede protection: one hidden test expires every ranking in the same second, and each miss is a
    scan.

editorial: |
  ### 1. Requirements (5 minutes)
  Clarify: which windows (last 1 h, 24 h), how fresh (under a minute), K (10–100), scope (global and
  per region), and whether counts must be exact. They need not be for ranking; creator analytics
  can be exact via a batch job. That one answer unlocks approximate algorithms.

  ### 2. Estimation
  - 2M events/s at peak, each carrying ~2 hashtags → **4M counter increments/s**.
  - Writing each increment to a database: impossible on one box, wasteful on many. Pre-aggregating
    in memory for 1 s collapses duplicates: with Zipf skew, 4M increments/s becomes ~200k distinct
    `(tag, minute)` updates/s.
  - Exact counts for 100M tags/day at ~50 B each ≈ 5 GB/day per window bucket. A count-min sketch
    with ε = 0.01%, δ = 0.1% is ~7 rows × 27k columns ≈ **750 KB**. Keep a min-heap of size K next
    to it to track the current heavy hitters.
  - Reads: 50k req/s for a list that changes once a minute → effectively 100% cacheable.

  ### 3. High-level design
  ```
  apps → ingest API → Kafka "events" (partitioned by item/tag hash, salted for hot tags)
       → aggregators (Flink / Kafka Streams): per-minute tumbling counts, local pre-aggregation
       → counts store (sharded; tag+minute buckets) and per-window sketch + top-K heap
       → ranker job every 30–60 s: merge partial top-Ks → write "trending:{region}:{window}" to Redis
  apps → trending API → Redis (precomputed top-K) → counts store only on a miss
  ```

  ### 4. Deep dives
  - **Count-min sketch.** d hash rows × w counters. Increment one counter per row; estimate = min
    across rows. Overestimates by at most εN with probability 1−δ, never underestimates, and sketches
    **merge by addition**, so each worker keeps its own and the ranker sums them. Pair it with a
    heap of size K (or Space-Saving / Misra-Gries) to remember *which* keys are heavy.
  - **Sliding windows.** Keep 60 one-minute buckets per window (a ring). The 1-hour count is the sum
    of the last 60 buckets; dropping the oldest bucket each minute expires old events. Sketches add
    and subtract cleanly per bucket. For "trending" rather than "popular", rank by velocity (this
    hour vs the same hour baseline), not raw count.
  - **Heavy hitters and hot keys.** Partitioning by tag sends 30% of events to one partition and one
    worker. Fix it in layers: pre-aggregate locally in every worker (one write per tag per second
    instead of thousands), and salt known hot tags across N sub-keys, summing them on read.
  - **Exactness trade-offs.** Approximate counts are fine for ranking; ties near position K may
    flicker. Spam and bots matter more than sketch error: dedupe per user per item, and weight
    distinct users rather than raw events. If exact numbers are shown to users, compute them in a
    batch pipeline (Lambda / Kappa reconciliation) and label real-time numbers as estimates.

  ### 5. What the hidden tests probe
  The simulator's workers write every event; real aggregators would pre-aggregate first. The
  simulator models the hot-key fix with the **hash + split hot keys** shard key.
  - **Final whistle (+60%).** Workers drain at ~6,150 events/s against 9,100 arriving, so the log
    absorbs the excess and processing falls ~12 s behind before catching up. Without the queue the
    shards run past 100% and the API times out.
  - **One tag takes over (75%).** With hash-by-key sharding the hot shard gets 75% + 25%/4 ≈ 81% of
    all writes and collapses. With split hot keys every shard gets 25%.
  - **Every ranking expires at once.** Each miss is a scan costing 15x an indexed read. Stampede
    protection and a TTL matched to the refresh interval keep the shards out of trouble.

  ### 6. Common mistakes
  - Writing every event to a database row, or running `ORDER BY count DESC` on every page view.
  - Sharding by tag without discussing the hot tag.
  - Proposing a count-min sketch without a heap: the sketch answers "how many?", not "which ones?".
  - Ignoring the window: an all-time counter never lets yesterday's tag fall off.

  ### 7. What good looks like
  - **E4:** queue in front of ingest, workers that count, a cached top-K endpoint, awareness that
    exact counting is expensive.
  - **E5:** per-minute buckets and sliding windows, count-min sketch plus heap with error bounds,
    local pre-aggregation, salting for hot tags, mergeable partial results.
  - **E6:** velocity-based trending with baselines, abuse resistance (distinct users, bot
    filtering), real-time vs batch reconciliation, cost per million events, and failure handling
    (replaying the log after a worker crash without double counting via checkpointed offsets).

design_prompt: |
  Answer each in a few sentences or a short sketch. Use numbers where you can.

  1. **API and event schema.** Define the ingest event and the trending read endpoint (parameters
     for region, window and K). What does the response contain, and how fresh is it?
  2. **Counting at 2M events/s.** Describe the aggregation pipeline from the log to the ranking.
     Where do you pre-aggregate, how are partitions keyed, and how do you stop one hot hashtag from
     overloading a single partition, worker or shard?
  3. **Approximate counting.** Explain how a count-min sketch works, size one for your error target,
     and say how you recover the actual top-K items (not just their counts). When would you insist
     on exact counts instead?
  4. **Windows.** How do you compute "top 10 in the last hour" and "top 10 in the last 24 hours" so
     that old events expire? How would you rank by velocity instead of raw volume?
  5. **Failure and correctness.** An aggregator crashes and restarts. How do you avoid losing or
     double counting events, and how do bots or a single user spamming a tag affect your ranking?
