slug: design-top-k-trending
kind: problem
title: Design top-K trending
difficulty: hard
day: 19
summary: Rank trending hashtags from a firehose of events. Ingest through a queue, aggregate with workers on hot-key-aware shards, and serve a tiny, cacheable top-K.
topics: [stream-processing, top-k, count-min-sketch, heavy-hitters, sliding-windows, sharding, hot-keys, message-queue, caching]
company_tags: [Twitter/X, TikTok, YouTube, Instagram, Amazon]
estimated_minutes: 45
incident: "Design review · 2M events/s at peak · trending page ships next sprint"

brief_beginner: |
  Every time someone watches, likes or shares a video, the app sends a tiny note to your servers:
  *"someone just engaged with #worldcup"*. These notes are called **events**. You want a page that
  shows the **top 10 trending hashtags** right now.

  The tricky part is the shape of the traffic. Writing is enormous and reading is tiny:

  - **95% of requests are events** pouring in, thousands every second, and they never stop.
  - **5% are people opening the trending page**, and they all want the same short list.

  Two more problems. When something big happens, one hashtag (say #worldcup) can be a third of all
  events. Whatever box is responsible for counting #worldcup gets buried. That is a **hot key**.
  And counting every single hashtag exactly, forever, would need huge amounts of memory, so real
  systems count *approximately* and only keep a recent **window** (the last hour, the last day).

  Today every event is written straight into one PostgreSQL database, and every trending-page
  request re-computes the ranking by scanning the counts. The database is many times over capacity.

  **Your job:** take events in through a buffer, count them with background workers in a way that a
  hot hashtag cannot overload, and serve the small top-10 list from somewhere fast. Then explain how
  you would count approximately and over time windows.

brief_expert: |
  **Functional:** ingest engagement events `(item_id, hashtags[], region, ts)`; expose
  `GET /trending?region=&window=1h|24h&k=10..100`; results refresh at least once a minute; support
  per-region and global rankings.

  **Non-functional:** 500M DAU, ~2M events/s at peak, ~100M distinct hashtags per day, heavy Zipf
  skew (the top tag can be 30% of events during a world event, 60% in the extreme). Trending reads
  ~50k req/s globally, highly cacheable. Freshness: under 60 s behind real time. Approximate counts
  are acceptable for ranking; exact counts are needed for creator analytics (separate batch path).

  **Graded part:** one ingest region at 6,000 req/s, 95% events, 5% top-K reads (0.5 GB of
  precomputed rankings). Event handlers are light (`app_work` 0.5). The ranking query has no index:
  computing it on demand is a scan, so serve it precomputed. The top tag takes 30% of events.
  Keep the ingest API as sized; the budget rules out four extra-large hash-sharded databases.

glossary:
  - term: Top-K
    meaning: The K items with the highest counts, for example the 10 most-used hashtags in the last hour.
  - term: Heavy hitter
    meaning: An item that appears far more often than the rest. Trending is about finding heavy hitters quickly.
  - term: Count-min sketch
    meaning: A small fixed-size table of counters that estimates how often each item appeared. It can overcount a little but never undercounts, and uses kilobytes instead of gigabytes.
  - term: Sliding window
    meaning: Counting only the last N minutes, so old events stop counting as time moves on.
  - term: Key salting
    meaning: Splitting one hot key into several sub-keys (#worldcup#1 … #worldcup#8) so its load spreads over several machines, then summing them when reading.

requirements:
  - "Normal day: p99 under 60 ms, error rate under 0.5%, event processing lag under 5 s"
  - Survive a world event and a mass cache expiry (hidden tests)
  - Stay within $4.40/hr (the ingest API stays at 9 large instances)

