      - {metric: error_rate, op: lte, value: 0.55}

hints:
  - Work out how many instances peak traffic needs. One medium instance serves about 167 of these requests per second, and peak is about 1,800. Then price that fleet against the budget.
  - Turn on autoscaling on the API. Look at its maximum instance count; the default may be far below what peak needs at 60% CPU. Then watch the logs to see when new instances actually become ready.
  - Set the maximum to about 24 and raise the starting count to about 9. A new instance takes 20 seconds to boot, so the servers you start with must carry roughly 25 seconds of traffic growth on their own. A faster ramp than this one is coming.

editorial: |
  ### Why it broke
  Each request renders a seat map, so it costs 3× the usual CPU: a medium instance serves about
  **167 req/s**. Seven instances give ~**1,170 req/s**. Peak traffic is **1,800 req/s**
  (~1,850 units with writes), so the fleet runs at **159%** at peak and **18% of requests fail**.

  ### Why not just run 15 servers?
  Fifteen fixed instances pass (p99 ≈ 73 ms) but cost **$1.70/hr**, and you pay that every quiet
  night. Fourteen cost $1.61/hr and still miss the latency target (≈ 91 ms, 79% busy at peak). Thirteen
  fit the budget but run at 86% and p99 reaches ≈ 128 ms. Fixed capacity is a bet on your worst
  evening.

  ### The fix: autoscaling with a real baseline
  ```
  API: medium × 9, autoscaling on, max 24   (60% CPU target, 20 s boot)
  ```
  Two settings matter:
  * **Max instances.** At 60% CPU, 1,850 units need ⌈1,850 ÷ (167 × 0.6)⌉ = **19** instances. The
    default max of 10 caps you at ~1,670 req/s, below peak.
  * **Baseline.** The autoscaler reacts to *current* load and new instances are ready ~20–25 s later.
    During a 90-second ramp, load grows by about half the baseline traffic in that window. Start with
    7 and the fleet runs hot while help is booting; start with **9** and it rides the gap.

  Result: p99 ≈ **75 ms**, no errors, **$1.50/hr** averaged over the run (fewer instances during the
  quiet first minute, 19–20 at the end).

  ### The trap: the boot gap
  The hidden tests use a **60-second ramp** and kill **three instances at peak**. With a baseline of 7,
  the faster ramp pushes p99 to ~135 ms; with 9 it stays at ~94 ms. When instances die the autoscaler
  launches replacements, and health checks pull the dead ones out within ~3 s, so errors stay below
  0.5%. Autoscaling is not instant capacity: it is capacity that arrives one boot time late.

  ### Alternatives
  * **Scheduled scaling** (scale up before a known event) beats reactive scaling when you know the
    date, but a surprise announcement gives no warning.
  * **A lower CPU target** (say 40%) reacts earlier at the cost of more idle capacity.
  * **Faster boots** (pre-baked images, warm pools) shrink the gap itself. That is often the best
    investment.
  * **Load shedding / a waiting room** protects the core flow when even autoscaling cannot keep up.

  ### Interview takeaway
  Autoscaling saves money on average and still needs headroom at the instant of a spike: baseline ≥
  traffic growth during (evaluation interval + boot time). Always state the max, the target
  utilisation and what happens in the first 30 seconds.
