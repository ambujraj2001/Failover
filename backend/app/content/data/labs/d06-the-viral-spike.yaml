    summary: Three API instances die at t=160s, at full traffic
    hidden: true
    scenario:
      duration: 180
      base_rps: 600
      read_ratio: 0.9
      app_work: 3
      spikes: [{at: 60, duration: 120, multiplier: 3, ramp: 90}]
      events: [{at: 160, type: kill_app_instance, count: 3}]
    assertions:
