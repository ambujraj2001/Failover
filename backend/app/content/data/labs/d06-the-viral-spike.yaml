slug: the-viral-spike
kind: lab
title: The viral spike
difficulty: medium
day: 6
summary: A surprise tour announcement triples traffic for the rest of the evening. Fixed capacity is either too small or too expensive. Autoscale, and keep enough baseline to survive the boot time.
topics: [autoscaling, horizontal-scaling, capacity-planning, cost]
company_tags: [Ticketmaster, Netflix, Amazon]
estimated_minutes: 25
incident: "SEV-2 · 18% of requests failing on Ticketnest seat map · API CPU 159% · traffic 3x baseline"

brief_beginner: |
  You run **Ticketnest**, a ticketing site. Every request renders a live seat map, so each one takes
  a fair amount of computer effort. On a normal evening **600 people per second** browse the site
  and seven servers handle it comfortably.

  Tonight a famous band announced a surprise tour on live TV. Over about a minute and a half,
  traffic climbs to **three times** normal and stays there. Seven servers cannot keep up, and about
  one request in six fails.

  You could simply run fifteen servers all the time, but you would pay for them every quiet night of
  the year. **Autoscaling** adds servers automatically when they get busy. The catch is that a new
  server takes about **20 seconds** to start, like calling in extra staff who need time to get to
  work. The servers you already have must cope on their own until help arrives.

  **Your job:** turn on autoscaling with a sensible upper limit, and keep enough servers running at
  the start to survive the wait, all within a budget that rules out running at peak size all the time.

brief_expert: |
  Baseline 600 rps, CPU-heavy handlers (`app_work` 3, so a medium instance serves ~167 rps). Traffic
  ramps 1x → 3x over 90 s starting at t=60 and holds to the end of the run: peak ~1.85k work units,
  ~11 instances at 100%. Static fleet of 7 saturates at ~1.9x.

  The autoscaler targets 60% CPU, evaluates every 5 s and needs 20 s to boot, so effective capacity
  lags demand by ~25 s. It never scales in during the run, and you pay for booting instances. Fixed
  provisioning for peak (14–15 instances) exceeds the budget. Choose a baseline that absorbs ~25 s of
  ramp growth and a max that covers peak at target utilisation. Expect steeper ramps and instance loss.

glossary:
  - term: Autoscaling
    meaning: Automatically adding servers when they are busy (and, in real systems, removing them when traffic drops).
  - term: Boot time
    meaning: How long a new server takes to start and accept traffic. Here, about 20 seconds.
  - term: Baseline
    meaning: The number of servers you keep running at all times, before the autoscaler adds any.
  - term: Target utilisation
    meaning: How busy the autoscaler tries to keep each server. Here it adds servers when CPU passes 60%.
  - term: Over-provisioning
    meaning: Running enough servers for your worst moment all the time. Safe, but you pay for idle machines.

requirements:
  - p99 latency under 90 ms while traffic triples
  - Error rate under 0.5%
  - Stay within $1.58/hr (running at peak size all evening does not fit)

budget: 1.58
palette: [load_balancer, app_server, database]

