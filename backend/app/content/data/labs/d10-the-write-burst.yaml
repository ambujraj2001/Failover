hints:
  - Run the burst and watch which box turns red first. The API has spare CPU; something it is waiting on does not.
  - Does the watch need the workout saved in PostgreSQL before it hears "OK", or only safely recorded somewhere? What component lets you reply first and save later?
  - Add a Message Queue (API → Queue → Worker → PostgreSQL) and keep API → PostgreSQL for reads. Each small worker drains about 385 writes/s here. Pick a drain rate above the normal 720 writes/s (or the backlog never clears) but well below what the primary can take alongside its reads (or the burst just moves to the database). Three small workers is a good place to start; more is not always better.

editorial: |
  ### Why it broke
  At the peak the API receives ~3,600 req/s, of which ~2,900 are uploads. Each insert costs 1.5
  units on PostgreSQL, so the primary is asked for **~4,300 units/s of writes plus ~700 reads**
  against a capacity of ~3,500, over 140% of what it can do. The simulator shows it pinned at
  **133%** (a little load never arrives because the API is already refusing it). Queries wait, every API thread ends up parked
  on a slow insert, and the API hits its in-flight limit: **11% of requests fail and p99 reaches
  ~1.5 s**, even though API CPU never passes 75%.

  The burst lasts 15 seconds. The database is perfectly able to store 15 seconds of uploads; it
  just cannot store them *in* 15 seconds.

  ### The fix: acknowledge now, persist at a steady rate
  ```
  POST /v1/workouts
    → enqueue(workout)            (~2 ms)  → 202 Accepted
  worker loop
    → dequeue → INSERT INTO workouts …   at ≤ ~1,150 writes/s
  ```
  - **Queue**: one partition takes 5,000 msg/s; the peak is ~2,900. Uploads are acknowledged in
    milliseconds, so p99 drops to **~76 ms**.
  - **Workers**: 3 small workers drain **~1,150 writes/s** (1,730 units on the primary). With
    ~720 reads at the peak, PostgreSQL tops out around **70%**.
  - **Backlog**: during the burst ~25k uploads queue up. Workers drain the excess at
    ~430/s (1,150 drain − 720 arriving), so **lag peaks at ~21 s** and is gone a minute later.
    Nothing is lost.

  ### The trap: draining too fast
  It is tempting to add lots of workers "so lag is zero". Six medium workers drain ~2,300
  writes/s, which is ~3,450 units: the queue now forwards the burst straight into PostgreSQL,
  the primary hits 140% again and **reads** start failing (error rate 9%). A queue only helps if
  the consumer side is **rate-limited below what the database can take**. That is backpressure.
  The hidden tests probe both sides: a longer burst with more reads (too many workers starve the
  reads) and a second burst before the first backlog has drained (too few workers let lag grow
  without bound; two small workers barely exceed the 720 writes/s baseline and lag passes 60 s).

  ### Alternatives and why not
  - **xlarge PostgreSQL** (~8,000 units/s): survives this burst at ~63% but costs ~$0.36/hr more,
    which breaks the budget, and every future burst means another vertical step until there are
    none left.
  - **Batching inserts in the API**: helps throughput, but the API still holds the request open
    until the batch commits, so you keep the thread pile-up.
  - **Shedding load (429 to watches)**: watches would retry, which turns a 15 s burst into a
    longer one. Accepting into a durable queue is cheaper and kinder.

  ### Interview takeaway
  When writes arrive in bursts and the client only needs an acknowledgement, put a durable
  queue in front of the database. Size consumers between the *average* write rate and what the
  store can absorb, and monitor **queue lag** as the user-facing freshness metric.
