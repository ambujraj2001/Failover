slug: the-write-burst
kind: lab
title: The write burst
difficulty: medium
day: 10
checkpoint: true
summary: Thousands of watches upload their workouts in the same 15 seconds. Absorb the burst with a queue and drain it at a pace the database can take.
topics: [queues, async-processing, backpressure, write-heavy, burst-traffic]
company_tags: [Strava, Garmin, Fitbit]
estimated_minutes: 30
incident: "SEV-2 · POST /v1/workouts 503s at 06:00 · PostgreSQL 133% busy · in-flight limit hit on Ingest API"

brief_beginner: |
  You run the backend for **Strideline**, a running watch. When a watch finishes a workout it
  uploads it to your **Ingest API**, which writes it into PostgreSQL. The phone app also reads
  recent workouts from the same database.

  On a normal morning that is about **900 requests per second**, and 80% of them are uploads
  (*writes*). At 06:00 today a firmware update finished on thousands of watches at once, they all
  reconnected, and for about 15 seconds traffic jumped to **four times normal**. The database can
  only save so many rows per second. It fell behind, requests piled up waiting for it, and the
  API started refusing uploads. Runners saw "sync failed".

  Here is the thing: a runner does not need their workout to be *in the database* within 5
  milliseconds. They need the watch to hear **"got it"** quickly. The saving can happen a few
  seconds later.

  A **message queue** is a waiting line for work. The API drops each upload into the queue
  (very fast) and replies "got it". Separate **workers** take uploads off the queue and write them
  to the database at a steady pace, so the burst turns into a short backlog instead of an outage.

  **Your job:** accept every upload quickly during the burst, and let the database catch up
  without falling over.

brief_expert: |
  Write-dominated ingest: 900 rps baseline (80% `INSERT workout`, 20% indexed reads), a 4× burst
  for 15 s with a 3 s ramp (3,600 rps, ~2,900 writes/s). Writes cost 1.5 units on PostgreSQL;
  the large instance (~3,500 units/s) needs ~5,000 at the peak. The Ingest API is cheap per request
  and is not the bottleneck; its threads are, once they block on a saturated primary.

  Decouple acknowledgement from persistence: API → queue (ack in ~2 ms), queue → workers →
  PostgreSQL. Size the drain rate below what the primary can take *while still serving reads*
  (backpressure), and above the steady-state write rate so the backlog actually drains. Queue lag
  must stay bounded and no write may be lost. An xlarge primary would absorb this burst but does
  not fit the budget, and the next burst will be bigger.

glossary:
  - term: Message queue
    meaning: A durable waiting line for work (Kafka, SQS, RabbitMQ). Producers add messages; consumers take them off later.
  - term: Worker
    meaning: A background process that pulls messages from the queue and does the slow part, here the database insert.
  - term: Queue lag
    meaning: How far behind the workers are, in seconds. 20 s lag means a workout uploaded now is saved about 20 s later.
  - term: Backpressure
    meaning: Deliberately limiting how fast work flows into a component so it is never pushed past what it can handle.
  - term: Asynchronous write
    meaning: The caller gets "accepted" right away and the actual save happens later, instead of waiting for it.

requirements:
  - p99 latency under 100 ms during a 4× upload burst
  - Error rate under 0.5% and zero lost writes
  - Queue lag under 25 s (workouts appear in the app within half a minute)
  - Stay within $1.20/hr (an xlarge database does not fit)

