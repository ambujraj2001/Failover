slug: stampede-at-the-top-of-the-hour
kind: lab
title: Stampede at the top of the hour
difficulty: medium
day: 9
summary: Every cached fare expires at the same second, and thousands of identical misses hit PostgreSQL at once. Coalesce the misses instead of buying a huge database.
topics: [cache-stampede, thundering-herd, request-coalescing, caching]
company_tags: [Expedia, Booking.com, Meta]
estimated_minutes: 25
incident: "SEV-2 · p99 > 700 ms every hour on the hour on GET /fares · PostgreSQL 127% at :00, 20% otherwise"

brief_beginner: |
  You run **Faretide**, a flight price search. Prices are stored in PostgreSQL, and because thousands
  of people search the same routes, the API keeps a copy of each answer in a Redis cache. About
  **98%** of searches are answered from Redis in under a millisecond, and the database idles at around
  **20%** busy.

  Except at the top of every hour. A pricing job refreshes all the fares at exactly :00 and gives each
  one a one-hour expiry. So an hour later, **they all expire in the same second**. Thousands of
  searches miss the cache at once, every one of them asks the database the same questions, and the
  database is suddenly asked for about **127%** of what it can do. For a few seconds searches crawl.

  Picture a bakery where every loaf on the shelf goes past its sell-by time at 9:00 sharp, and every
  customer walks into the kitchen to ask the baker for a fresh one, all at once. A sensible bakery puts
  one person in the kitchen to bake each kind of loaf while everyone else waits a moment at the
  counter. That is **stampede protection**.

  **Your job:** survive the top of the hour, and a Redis restart, without paying for a database
  sized for a few seconds a day.

brief_expert: |
  5k rps, 95% reads, 95% of them cacheable, 3 GB hot set in a 4 GB Redis (TTL 3600 s, hit ratio ~98%).
  PostgreSQL large sits at ~20%. At :00 a synchronised expiry drops the hit ratio to ~15% (recovers
  with τ ≈ 4 s): ~3.8k identical misses/s fan out to the database, peaking at ~127% of capacity.
  The backlog drains slowly and drives p99 into the high hundreds of ms.

  Coalesce concurrent misses for the same key (single-flight / request coalescing) so the database
  sees one fetch per key rather than one per request. Also plan for a full cold start (Redis restart,
  τ ≈ 8 s) and for the expiry wave coinciding with a traffic spike. An xlarge database (or a replica)
  absorbs it but does not fit the budget.

glossary:
  - term: Cache stampede
    meaning: Many requests miss the cache at the same moment and all go to the database together. Also called a thundering herd.
  - term: TTL
    meaning: Time to live. How long a cached entry is kept before it expires and must be fetched again.
  - term: Request coalescing
    meaning: When many requests miss the same key, one of them fetches it from the database and the rest wait for that answer.
  - term: TTL jitter
    meaning: Adding a small random amount to each expiry so keys do not all expire at the same second.

requirements:
  - p99 latency under 58 ms, including the top of the hour
  - Error rate under 0.2%
  - Stay within $2.25/hr (an xlarge database does not fit)

budget: 2.25
palette: [load_balancer, app_server, cache, database]

