      - {metric: error_rate, op: lte, value: 0.5}

hints:
  - Run the test and look at the latency chart and the logs. Everything is calm except for a few seconds. What happened to Redis at that moment, and what did PostgreSQL see?
  - The database is not too small for a normal day; it is too small for thousands of identical misses arriving in the same second. Most of those misses are asking for the same few keys. Look at the cache's resilience settings.
  - Turn on stampede protection on Redis (request coalescing). One request per key goes to the database and the rest wait for its answer, which cuts the miss storm by up to 75% while the cache refills. Then think about a full Redis restart, which is a longer and colder version of the same event.

editorial: |
  ### Why it broke
  On a normal second Redis answers ~98% of fare lookups and PostgreSQL (large, 3,500 qps) handles
  ~70 misses, ~240 uncacheable reads and ~250 writes: about **20%** busy. Then the hourly expiry hits.
  The hit ratio drops to ~15% and about **3,800 misses/s** arrive at once, nearly all for the same
  popular routes. The database is asked for ~4,450 units/s, **127%** of capacity. A queue builds, and
  because the cache refills only as those slow queries complete, the backlog takes seconds to drain.
  p99 for the whole run lands near **790 ms**, from a few bad seconds.

  ### The fix: coalesce the misses
  ```
  GET fare:LHR-JFK  → miss
     first request  → acquires the per-key lock → SELECT … → SET fare:LHR-JFK → releases
     other requests → wait a few ms for that value (no database call)
  ```
  With stampede protection on, the database peaks at about **61%** during the wave. p99 drops to about
  **49 ms** with no errors, at the same cost (**$2.04/hr**). No extra hardware at all.

  ### The trap: a fully cold cache
  An expiry wave is a partial, fast-recovering stampede. A **Redis restart** is the full version: every
  key is gone and refilling takes longer. Without coalescing it fails ~1.7% of requests and p99 goes past
  a second. With it, p99 stays near 50 ms. The flash-sale test lands the wave on top of 30% more traffic;
  the protected design peaks near 80% busy and holds at ~76 ms p99.

  ### Alternatives
  * **An xlarge database** absorbs the herd (p99 ≈ 49 ms) for **$2.41/hr**, paying all day for a few
    seconds an hour. A read replica costs the same and is also over budget.
  * **TTL jitter** (expire each key at 3600 s ± a few minutes) stops the keys expiring together. It is
    the right fix at the source, but does nothing for a Redis restart.
  * **Probabilistic early refresh** (refresh a hot key slightly before it expires) or **serving stale
    while revalidating** keep the old value available while one worker fetches the new one.
  * **More Redis memory** does not help: the problem is *when* keys expire, not how many fit.

  ### Interview takeaway
  Whenever you add a cache, ask what the database sees when the cache is empty or a big batch of keys
  expires at once. Standard answers: request coalescing (single-flight), TTL jitter, early or background
  refresh, and warming the cache before it takes traffic.
