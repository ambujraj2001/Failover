hints:
  - Run the test and read the failure reasons. The database is overloaded, but the errors come from the API itself. Why would the API refuse a request that only needed Redis?
  - "Little's law: threads in use = requests per second × seconds each request holds a thread. At ~8,800 req/s, how long can a request wait on the database before the API runs out of its 3,072 threads?"
  - "Bring the timeout down to a few hundred milliseconds (under ~350 ms at the peak rate), drop retries to 0 or 1, and turn on the circuit breaker. Then compare how long errors last after the push ends with and without the breaker: that tail is the metastable part."

editorial: |
  ### Why it broke
  orders-db can do ~600 units/s and normally runs at ~480. The push sends it ~1,250. That part is
  unavoidable: for a few seconds the database queues and then rejects work.

  What turned it into an outage is the API. Each request that reaches the database can hold a
  thread for up to **10 s**, and up to 4 attempts. By Little's law, ~8,800 req/s with even 1 s of
  waiting needs ~8,800 threads; the fleet has **3,072**. The API hits its in-flight limit and
  starts rejecting *everything*, including the 89% of requests that only needed Redis. From
  t=24 to t=35 **50–63% of all requests fail**, p99 sits near **10 s**, and the tail stays above
  1 s for another 8 s. Overall: **15.4% errors, p99 5.4 s**.

  ### Step 1: a timeout is a thread budget
  At 300 ms, in-flight at the peak is ~8,840 × 0.31 s ≈ **2,740 threads**: under 3,072, so the
  API never saturates and cache hits keep flowing. DB-bound requests that cannot be served now
  fail in 300 ms instead of hanging. (500 ms looks "safer" but needs ~4,400 threads: the API
  falls over again, ~13% errors.)

  ### Step 2: the metastable tail
  With only the timeout fixed, watch what happens after the push. At t=26 the database's queue
  is full (5 s of work) and it starts rejecting. With 3 retries, every rejection comes back: at a
  55% rejection rate the database receives 1 + 0.55 + 0.30 + 0.17 = **2.0×** the traffic, which
  pushes rejections to **85%** and the multiplier to **3.2×**. The push ends at t=37, yet the
  database stays saturated until t=40, and then spends until **t=64** chewing through a full queue
  of requests whose callers timed out long ago. **27 seconds of errors after traffic was back to
  normal**: the overload outlived its trigger. Result: 6.9% errors.

  ```
  trigger ──▶ DB queue fills ──▶ timeouts + rejections ──▶ retries add load ──┐
                  ▲                                                          │
                  └──────────────────── keeps the queue full ◀───────────────┘
  ```

  ### Step 3: a circuit breaker breaks the loop
  When more than half of the calls fail, the breaker opens for 5 s: the API fails DB-bound
  requests instantly and sends only ~10% of them as probes. The database drains its queue
  (3,000 → ~1,100 units in 4 s), the breaker closes, opens once more at t=35, and the backlog is
  gone by **t=46** instead of t=64. With retries at 1 the amplification is capped at 2× even
  before the breaker trips. Result: **4.96% errors, p99 62 ms**, all of them fast, all of them on
  the ~11% of requests that genuinely needed the overloaded database.

  ### The trap the hidden tests probe
  A second push 30 s later lands while the database is still draining the first one. Without a
  breaker the two tails merge (7.5% errors); with it, each push is contained (5.6%). A longer,
  30 s push checks that the fix holds while the overload is sustained, not just for a blip.

  ### Alternatives and why not
  - **Bigger database**: the honest long-term fix for capacity, but it is over budget, and it only
    moves the threshold. The next push that exceeds it brings the same outage back unless the API
    fails gracefully.
  - **More API instances** to get more threads: you would need ~3× the fleet to hold 10 s waits,
    all of it parked on a database that cannot answer.
  - **Exponential backoff with jitter**: the right way to retry (and what you should use for the
    one retry you keep). It spreads retries out but does not remove the load; a breaker does.

  ### Interview takeaway
  Set timeouts from the dependency's latency SLO and your thread budget (Little's law), retry at
  most once with backoff and jitter, put a circuit breaker on every remote dependency, and look
  for feedback loops that keep an overload alive after the trigger is gone.
