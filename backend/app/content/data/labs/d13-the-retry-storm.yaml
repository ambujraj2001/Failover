slug: the-retry-storm
kind: lab
title: The retry storm
difficulty: hard
day: 13
checkpoint: true
summary: A 15-second marketing push overloads the database, and the API's 10-second timeouts and triple retries turn it into a full outage. Contain the failure instead of amplifying it.
topics: [timeouts, retries, circuit-breaker, metastable-failure, failure-containment, littles-law]
company_tags: [Amazon, Netflix, Uber]
estimated_minutes: 35
incident: "SEV-1 · 60% of all requests 503 at 19:00 · API in-flight limit reached · p99 10 s · orders-db 100%"

brief_beginner: |
  You run **Hearthly**, an app for booking plumbers and electricians. About **3,400 requests per
  second** hit your API. Almost all of them are cheap: 95% read pages that are already in Redis.
  A small share (about 1 in 9) must touch the **orders database**, which is small and runs at
  80% busy on a normal evening.

  At 19:00 marketing sent a push notification to every user. For **15 seconds** traffic was
  **2.6×** normal. The database could not keep up with its share, which is expected. What was
  not expected: the whole app went down, including the pages that never touch the database, and
  latency hit 10 seconds.

  Two settings on the API made it worse:
  - **Timeout** = how long the API waits for the database before giving up. Yours is 10 seconds.
    While a request waits, it occupies one of the API's worker threads, and there are only so many.
  - **Retries** = how many times the API tries again after a failure. Yours is 3, so one failed
    call can become four calls, landing on a database that is already drowning.

  A **circuit breaker** is the third tool: when most calls to the database are failing, stop
  calling it for a few seconds and fail fast instead. The database gets room to recover, and the
  API stays free to serve everything else.

  You cannot buy a bigger database (budget). You can change how the API behaves when it is in
  trouble.

  **Your job:** keep the app fast while the push overloads the database, and make sure everything
  is healthy again soon after the push ends.

brief_expert: |
  3,400 rps (95% reads, 95% cacheable, ~98% hit ratio), so ~11% of requests are DB-bound.
  orders-db (PostgreSQL small, ~600 units/s) at ~80% busy. A push drives traffic to 2.6× for 15 s
  (ramp 2 s): DB-bound load reaches ~2× capacity. API: 12 × large (3,072 threads, ~30% CPU),
  `timeout_ms = 10000`, `retries = 3`, no circuit breaker.

  The database *will* shed work during the push; the goal is to keep that from spreading. Apply
  Little's law to the thread pool (in-flight = rate × time held), bound the time a request can
  hold a thread, stop retry amplification on a dependency that is rejecting work, and give the
  database a way to drain its queue once the trigger is gone (the recovery tail is where most of
  the damage happens). A larger database does not fit the budget.

glossary:
  - term: Timeout
    meaning: The longest the API waits for a dependency before giving up. It bounds latency, and how long a thread is tied up.
  - term: Retry amplification
    meaning: Retrying failed calls multiplies the load on the thing that is failing. 3 retries can mean 4× the traffic.
  - term: Circuit breaker
    meaning: After too many failures, stop calling a dependency for a short time and fail immediately, so it can recover.
  - term: Metastable failure
    meaning: An overload that keeps itself going after its trigger is gone, because the system's own reaction (queues, retries) sustains it.
  - term: Little's law
    meaning: Requests in flight = arrival rate × time each one takes. 8,000 req/s held for 1 s = 8,000 threads busy.

requirements:
  - During and after the push, p99 latency under 80 ms
  - Error rate under 5.8% over the run (the database cannot serve its share during the push; the rest of the app must)
  - Stay within $2.30/hr (a bigger orders database does not fit)

