tests:
  - id: scrape
    name: Scrapers arrive
    summary: 2,000 req/s of shoppers, plus 8,000 req/s of bots for 40 s
    scenario:
      duration: 60
      base_rps: 2000
      read_ratio: 0.9
      cacheable: 0.8
      working_set_gb: 2
      events: [{at: 15, type: bot_wave, ratio: 4, duration: 40, label: "Scrapers: +8,000 req/s of search requests from 300 IPs"}]
    assertions:
      - {metric: p99_ms, op: lte, value: 70}
      - {metric: error_rate, op: lte, value: 4}
  - id: normal-day
    name: A normal Tuesday
    summary: Only real shoppers, no bots
    hidden: true
    scenario:
      duration: 60
      base_rps: 2000
      read_ratio: 0.9
      cacheable: 0.8
      working_set_gb: 2
    assertions:
      - {metric: error_rate, op: lte, value: 0.5}
      - {metric: p99_ms, op: lte, value: 60}
  - id: bigger-wave
    name: The scrapers scale up
    summary: 14,000 req/s of bots for 40 s
    hidden: true
    scenario:
      duration: 60
      base_rps: 2000
      read_ratio: 0.9
      cacheable: 0.8
      working_set_gb: 2
      events: [{at: 10, type: bot_wave, ratio: 7, duration: 40}]
    assertions:
      - {metric: p99_ms, op: lte, value: 75}
      - {metric: error_rate, op: lte, value: 1}

hints:
  - Run the test. The cache hit ratio is still ~98%, so the extra load is not coming from product pages. What kind of traffic is it, and which box sees it first?
  - Scaling the API and database to absorb 8,000 bot requests per second does not fit the budget. Look at the Load Balancer's Protection settings.
  - Turn on rate limiting. Then think about who else sends bursts — a family sharing one IP, a shopper clicking fast. 10 req/s blocks about 3% of real users; 200 req/s lets 20% of the bots through. Check the requirements for a normal day before you pick.

editorial: |
  ### Why it broke
  Bot traffic skips the cache: search results are keyed by arbitrary queries, so every bot
  request runs on the API and reaches PostgreSQL. At 8,000 extra req/s the API needs ~2.5× its
  capacity (**peak 250% busy**) and PostgreSQL goes to 129%. The API's request queue overflows and
  it starts refusing everyone, so **55% of real shoppers' requests fail** with p99 ~1.2 s, even
  though their product pages are sitting in Redis.

  ### The fix: per-client rate limiting at the edge
  The load balancer counts requests per client and answers 429 above the limit, before any API
  work happens:

  | limit | bots blocked | real shoppers blocked | result |
  |---|---|---|---|
  | none | 0% | 0% | 55% errors, p99 1.2 s |
  | 200 req/s | 80% | 0% | 1,600 bot req/s still reach the API: 23% errors, p99 2.1 s |
  | **50 req/s** | **97%** | **0.2%** | **240 bot req/s get through: p99 52 ms, 0.2% errors** |
  | 10 req/s | 99% | 3% | fast, but 3% of real shoppers get 429s, every day |

  At 50 req/s the API sits at ~57% and PostgreSQL at ~62% during the attack: the remaining bot
  traffic is noise.

  ### The trap: the limit that looks best on attack day
  10 req/s looks great while the bots are running: p99 46 ms, and the 3% errors fit under the
  incident's 4% bar. But it blocks 3% of legitimate traffic **every day**: households and offices
  behind one NAT address, a shopper paging quickly through results, a mobile app prefetching. The
  hidden "normal Tuesday" test runs without bots and requires < 0.5% errors; 10 req/s fails it with
  3%. The other hidden test raises the wave to 14,000 req/s: at 200 req/s, 2,800 bot req/s leak
  through and the API saturates again. A rate limit is a classifier: tune it on *normal* traffic
  first, then confirm it stops the attack.

  ### Alternatives and why not
  - **Scale to absorb**: ~4× the API fleet and a database two sizes up to serve robots. Out of
    budget, and the bots can always add machines faster than you can.
  - **Cache search results**: the long tail of queries has almost no reuse; scrapers vary
    parameters precisely to defeat caches.
  - **Block IP ranges by hand**: works for an hour. Rate limits (plus bot scoring, CAPTCHAs on
    suspicious sessions, authenticated API keys with quotas) are the durable layer.

  ### Interview takeaway
  Protect expensive, uncacheable endpoints with rate limits enforced as early as possible
  (edge/LB), keyed per client, sized from the real-user distribution (p99.9 of legitimate
  per-client rates plus headroom), and returning 429 with Retry-After.
