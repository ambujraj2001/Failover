slug: the-scraper-flood
kind: lab
title: The scraper flood
difficulty: medium
day: 12
summary: Price-comparison bots hammer the uncacheable search endpoint and starve real shoppers. Rate-limit per client at a level that stops bots without touching customers.
topics: [rate-limiting, abuse-prevention, api-protection, load-shedding]
company_tags: [Amazon, Cloudflare, Instacart]
estimated_minutes: 25
incident: "SEV-2 · 55% of /search requests failing · 8,000 req/s from 300 IPs · API CPU 250%"

brief_beginner: |
  You run **Shelfwise**, an online grocery store. Real shoppers send about **2,000 requests per
  second**. Most of them read product pages, which you already keep in Redis, so they are cheap.

  This morning a few hundred machines started scraping your prices: they request search results
  for every product, over and over, around **8,000 extra requests per second**. Search results
  depend on the exact query, so the cache cannot help; every bot request runs on your API and hits
  PostgreSQL. Your servers are now spending most of their time answering robots, and more than
  half of your real customers get errors.

  Bots and people look different: a person clicks a few times per second at most; a scraper
  sends hundreds of requests per second from the same address. **Rate limiting** means the load
  balancer counts requests per client and rejects the ones over a limit (with HTTP **429 Too Many
  Requests**) before they ever reach your API.

  The catch is choosing the limit. Too high and the bots still get through. Too low and you
  block real shoppers who happen to click quickly, or share an office network.

  **Your job:** keep real shoppers fast and error-free while the scrapers are running, and on a
  normal day too.

brief_expert: |
  Legitimate load: 2,000 rps, 90% reads (80% cacheable, Redis hit ratio ~98%), PostgreSQL medium
  at ~46%, API (4 × large) at ~51%. A bot wave adds 8,000 rps of uncacheable reads for 40 s,
  which drives API CPU to ~250% and PostgreSQL past saturation. Bot traffic is not counted in
  the error rate, but it consumes capacity.

  Absorbing it is not an option within budget (it would take ~4× the API fleet plus a database
  two sizes up). Enable per-client rate limiting at the load balancer and pick the threshold:
  10, 50 or 200 req/s. The trade-off is false positives (legitimate clients over the limit) vs
  leakage (bot traffic under it). The SLO applies on attack days and on normal days.

glossary:
  - term: Rate limiting
    meaning: Capping how many requests one client (IP, API key, user) may send per second. Extra requests are rejected early.
  - term: HTTP 429
    meaning: The "Too Many Requests" status code a rate limiter returns. Well-behaved clients slow down when they see it.
  - term: Scraper
    meaning: A bot that downloads your pages automatically, often to copy prices or content.
  - term: False positive
    meaning: A real user wrongly treated as abusive and blocked. The hidden cost of a limit that is too tight.

requirements:
  - During the scraper wave, p99 under 70 ms and errors under 4%
  - On a normal day, error rate under 0.5% (real shoppers must not be throttled)
  - Stay within $1.20/hr (no buying your way out)

budget: 1.2
palette: [load_balancer, app_server, cache, database]

