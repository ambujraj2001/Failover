slug: primary-down-at-3am
kind: lab
title: Primary down at 3 am
difficulty: medium
day: 11
summary: The only PostgreSQL node dies and takes the whole product with it. Add a standby that takes over by itself, and make sure the survivor can carry the load.
topics: [failover, replication, redundancy, rto-rpo, high-availability]
company_tags: [GitHub, Stripe, Shopify]
estimated_minutes: 25
incident: "SEV-1 · 100% of /api/* failing since 03:12 · PostgreSQL primary unreachable · no standby"

brief_beginner: |
  You run **Ledgerly**, an invoicing app for small businesses. About **1,100 requests per
  second** reach your API; 90% of them read data (open an invoice, list customers) and 10% write
  (send an invoice, record a payment). Everything lives in **one** PostgreSQL server.

  At 03:12 that server's disk controller failed. The machine is gone. Every page that needs the
  database (all of them) now returns an error, and they will keep doing so until someone wakes
  up, restores a backup onto a new machine and points the app at it. That usually takes hours.

  The fix is **redundancy**: keep a second copy of the database running all the time, kept up
  to date by **replication** (every change on the main server, the *primary*, is copied to the
  *replica*). If the primary dies, the replica is **promoted** to become the new primary. With
  **automatic failover** that happens in seconds, with nobody awake.

  Two numbers describe how good your recovery is:
  - **RTO** (recovery time objective): how long you are down. Here, the business accepts about
    a dozen seconds of failed writes.
  - **RPO** (recovery point objective): how much recent data you can lose. For invoices and
    payments the answer is *none*.

  **Your job:** make the app survive the primary dying (and dying again), without losing a single
  saved invoice.

brief_expert: |
  1,100 rps, 90/10 read/write, single PostgreSQL medium (~1,500 units/s) at ~77% busy. A
  `kill_db_primary` event leaves it permanently down: reads and writes fail for the rest of the
  run. Requirements: RTO ≈ one failover (~12 s of write errors), **RPO = 0**, p99 unaffected.

  You need at least one replica with automatic failover. Then think past the first event:
  async vs sync replication (lag means stale reads now and lost commits at promotion; sync costs
  ~3 ms per write), how much capacity is left once a replica has been promoted (N+1 at peak),
  and what happens if the promoted node is the next to fail. The budget is enough for a smart
  topology, not for oversizing every node.

glossary:
  - term: Replica
    meaning: A live copy of the database that receives every change from the primary and can serve reads.
  - term: Failover
    meaning: Promoting a replica to be the new primary when the old one dies. Automatic failover does it without a human.
  - term: RTO
    meaning: Recovery time objective. The longest outage the business accepts, e.g. "back within 15 seconds".
  - term: RPO
    meaning: Recovery point objective. How much recent data you may lose. RPO = 0 means no acknowledged write is ever lost.
  - term: Synchronous replication
    meaning: The primary waits for the replica to confirm a write before telling the app it succeeded. Slower writes, no lag.

requirements:
  - Survive the primary dying with error rate under 1.6% over the run (one ~12 s failover)
  - RPO = 0 — no replication lag (stale reads at most 0.1%)
  - p99 latency under 80 ms
  - Stay within $1.15/hr

