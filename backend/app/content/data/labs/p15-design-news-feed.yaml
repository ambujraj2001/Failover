    assertions:
      - {metric: error_rate, op: lte, value: 1.0}
      - {metric: p99_ms, op: lte, value: 150}
  - id: posting-burst
    name: Final whistle
    summary: A match ends and everyone posts. The posting rate triples and traffic rises 30% for 20 seconds
    hidden: true
    scenario:
      base_rps: 10000
      static_ratio: 0.3
      read_ratio: 0.85
      cacheable: 0.85
      working_set_gb: 24
      query_column: user_id
