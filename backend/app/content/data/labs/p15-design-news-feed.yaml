  - id: celebrity-post
    name: A celebrity posts
    summary: Traffic up 30%, most cached timelines invalidated at t=25s, one account takes 40% of keyed traffic
    hidden: true
    scenario:
      base_rps: 10000
      static_ratio: 0.3
      read_ratio: 0.95
      cacheable: 0.85
      working_set_gb: 24
      hot_key_share: 0.4
