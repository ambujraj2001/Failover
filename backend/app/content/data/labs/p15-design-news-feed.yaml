    assertions:
      - {metric: error_rate, op: lte, value: 0.5}
      - {metric: p99_ms, op: lte, value: 150}
      - {metric: queue_lag_s, op: lte, value: 10}
      - {metric: write_loss_rate, op: lte, value: 0}

hints:
  - Separate the three kinds of traffic. Media can be served from the edge without touching your servers. Timeline reads are the bulk of the work. Posts are few but each one fans out to many timelines.
  - Precompute timelines and keep them in Redis (App → Redis, App → Posts DB for misses). Size the cache for the 24 GB hot set. Even at a 97% hit ratio, the 15% of reads that bypass the cache still reach the database, so give reads more than one node to land on.
  - Move fan-out off the request path (App → Queue → Workers → Posts DB) and size the workers for a burst of posting, not the average. Then imagine 85% of cached timelines vanishing at once after a celebrity post. What protects the database in those seconds?

design_prompt: |
  Answer in writing. Use numbers where you can.

  1. **API.** Define `POST /posts`, `GET /feed` (with cursor pagination) and follow/unfollow. What does
     a feed page return: full posts or IDs that the client hydrates? Why does cursor pagination beat
     offset pagination for a feed that changes while you scroll?
  2. **Data model.** Give the tables or key-value layouts for posts, the follow graph and precomputed
     timelines, with partition keys. How large is one user's cached timeline (how many entries, how
     many bytes) and how much memory does the whole hot set need?
  3. **Fan-out strategy.** Push, pull or hybrid? State the threshold at which you switch an author
     from push to pull and why. Walk through what happens when an account with 50M followers posts,
     and how that post appears in a follower's feed.
  4. **Hot keys and cache failure.** A celebrity post is read by millions within a minute, and
     rebuilding cached timelines causes a wave of misses. How do you protect the cache and the
     database (request coalescing, replicating hot keys, jittered TTLs, a local in-process cache)?
  5. **Consistency.** A user posts and immediately refreshes their own feed. How do you guarantee
     they see their post when timelines are built asynchronously and reads may hit a lagging
     replica? What happens to cached timelines when someone unfollows or deletes a post?

editorial: |
  ### 1. Requirements
  * **Functional:** post, follow, home timeline with cursor pagination.
  * **Non-functional:** fast reads, eventual consistency for others' posts (seconds), read-your-own-
    writes for the author, availability over consistency.

  ### 2. Estimation
  | quantity | value |
  |---|---|
  | timeline reads | 200M × 20 = 4B/day ≈ 46k/s avg, ~100k/s peak globally |
  | posts | 200M/day ≈ 2.3k/s; × 200 followers ≈ 460k timeline inserts/s if pushed naively |
  | timeline entry | post_id + author_id + ts ≈ 20 B; 800 entries per user ≈ 16 KB |
  | hot set | active users in a cell × 16 KB ≈ 24 GB → two 16 GB Redis nodes |
  | modelled cell | 10k rps: 3,000 media, 6,650 timeline reads, 350 fan-out writes/s |

  ### 3. High-level design
  ```
  Users → CDN ─► Media (object storage)            images and video at the edge
            └─► LB → Feed API ─┬─► Timeline cache (Redis, 2 × 16 GB)
                               ├─► Posts DB (primary + replica) for misses and deep pages
                               └─► Fan-out queue → workers → timelines / Posts DB
  ```

  ### 4. Why the starter fails
  6,650 reads/s plus ~525 write units on one large PostgreSQL (3,500/s): twice its capacity. Eight
  API instances are also short: ~7,100 units of work need ~12 large instances at 60%.

  ### 5. Deep dives
  **Hybrid fan-out.** Push for normal accounts: on post, workers append the post ID to each
  follower's timeline list in Redis (capped at ~800 entries). Pull for accounts above a threshold
  (say 1M followers): their posts are not fanned out; at read time the feed service merges the
  precomputed timeline with recent posts from the few celebrities the user follows. This bounds
  the worst-case fan-out cost and keeps reads cheap.

  **Database reads.** With ~97% of cacheable reads hitting Redis, the database still sees ~1,000
  uncacheable reads plus ~150 misses per second. Splitting them over primary + one replica keeps
  the primary around 30% busy with writes included, leaving room for the bad minute.

  **Celebrity post.** The hidden test drops the timeline cache hit ratio to 15% at the top of a 30%
  surge. Without request coalescing, ~6,000 extra reads/s land on the database. With stampede
  protection and a replica, the database peaks around 75% for a few seconds and recovers. Real-world
  extras: replicate hot keys across cache nodes, add a small in-process cache for the hottest posts,
  and jitter TTLs so expiries do not align.

  **Hot shard.** If you shard posts by author, the celebrity's shard takes `0.4 + 0.6 / N` of the
  traffic; splitting hot keys (or sharding timelines by reader rather than posts by author) avoids it.

  **Read-your-writes.** Write the author's own post into their timeline synchronously (or merge
  "my recent posts" at read time), and route the author's reads to the primary for a few seconds.

  ### 6. What the hidden tests probe
  * **Celebrity post:** cache-miss wave + surge. Fails without stampede protection, or with a single
    large database and no replica (a bigger primary also works, but buys no failover).
  * **Both hidden tests add a 30% surge.** Twelve API instances peak near 80%; ten pass the visible
    test but blow the latency limit here.
  * **Final whistle:** posting triples, peaking at ~1,400 fan-out writes/s during the 20 s surge. Two large workers drain
    ~1,540/s, so the queue stays near empty. One worker drains ~770/s and the backlog grows to over
    30 s of lag: followers see posts half a minute late. Size workers for the burst, and remember
    their drain rate becomes write load on the primary.

  ### 7. Common mistakes
  * Pure push without a celebrity exception (one post → 50M writes).
  * Pure pull at this read volume (each read merges hundreds of lists).
  * Caching full post bodies in every timeline (memory explodes; store IDs and hydrate).
  * Offset pagination on a constantly changing list.

  ### 8. What good answers look like
  * **E4:** cache timelines, push fan-out via a queue, replicas for reads, CDN for media.
  * **E5:** hybrid fan-out with a stated threshold and the merge at read time; timeline sizing
    in bytes; cursor pagination; read-your-writes for authors; stampede protection.
  * **E6:** ranking pipeline (candidate generation, feature store, model scoring) and its latency
    budget, backfill on follow and cleanup on unfollow, inactive-user optimisation (do not fan out to
    users who have not logged in for 30 days), multi-region timelines, hot-key replication.
