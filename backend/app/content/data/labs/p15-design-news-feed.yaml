slug: design-news-feed
kind: problem
title: Design a news feed
difficulty: medium
day: 15
checkpoint: true
summary: Design the Twitter/Instagram home timeline. Reads dwarf writes, timelines live in cache, and one celebrity post can knock the cache over.
topics: [news-feed, fan-out, timeline-cache, read-replicas, hot-keys, message-queue, cdn]
company_tags: [Meta, Twitter, Instagram, LinkedIn, Pinterest, Snap, TikTok]
estimated_minutes: 50
incident: "Launch review · 200M DAU · 10k req/s per cell at peak · design due Friday"

brief_beginner: |
  You are building the home feed for **Murmur**, a social app. When someone opens the app they
  see a **timeline**: the newest posts from everyone they follow, mixed together. Opening the feed
  happens constantly. Posting happens much less often: for every post, there are about
  **twenty feed loads**.

  Picture a newspaper printed separately for every reader. You can either print each reader's
  paper the moment a story comes in (do the work when someone posts), or assemble it when the
  reader asks (do the work when someone opens the app). Most people follow a few hundred
  accounts, so printing ahead works well. But when a **celebrity** with 50 million followers
  posts, "printing ahead" means 50 million papers at once.

  At peak a single region handles **10,000 requests per second**. About 30% are images and
  videos. Of the rest, 95% are feed reads. Today every feed load runs a query against one
  database, which falls over long before peak.

  Words you will need. A **CDN** stores images close to users so they never reach your servers. A
  **cache** keeps ready-made timelines in fast memory. A **read replica** is a copy of the
  database that can answer reads, taking load off the main one (the **primary**), which still
  handles every write. A **queue** lets you hand off slow background work, such as copying a new
  post into followers' timelines.

  **Your job:** design a feed that loads fast at peak, keeps up with new posts, and survives the
  moment a celebrity posts and millions of cached timelines need rebuilding at once.

brief_expert: |
  **Functional:** post (text + media), follow/unfollow, home timeline (reverse-chronological, with
  room for ranking later), paginated by cursor.

  **Non-functional:** timeline p99 < 120 ms, post visible to followers within ~5 s (eventual
  consistency is fine), 99.95% availability, read:write ≈ 20:1.

  **Scale:** 200M DAU × ~20 feed loads/day ≈ 4B timeline reads/day (~50k/s avg globally) and
  ~200M posts/day. Average 200 followees; a long tail of accounts with 10M+ followers. Modelled cell
  at peak: **10k rps, 30% media, 95% of dynamic requests are timeline reads**, ~85% of which
  are served from precomputed timelines; the remaining 15% (deep pages, cache-bypassing filters)
  hit the database. Writes are fan-out inserts after batching. Hot timeline set ≈ 24 GB.

  The starter queries one PostgreSQL per feed load. Choose a fan-out strategy, precompute and cache
  timelines, spread database reads, and move fan-out off the request path. The hidden tests include
  a celebrity post that invalidates a large share of cached timelines, and a burst of posting.

glossary:
  - term: Fan-out on write (push)
    meaning: When someone posts, copy the post ID into every follower's timeline straight away. Reads become a cheap lookup; posts by people with many followers become expensive.
  - term: Fan-out on read (pull)
    meaning: When someone opens the feed, fetch recent posts from everyone they follow and merge them. Posting is cheap; every read does more work.
  - term: Hot key
    meaning: One piece of data that a huge share of traffic touches at once, such as a celebrity's newest post. It overloads whichever single server holds it.
  - term: Read replica
    meaning: A copy of the database that serves reads. Writes still go to the primary and are copied over, usually a fraction of a second later.
  - term: Cache stampede
    meaning: Many requests miss the cache at the same moment and all hit the database together.

requirements:
  - Timeline p99 under 120 ms at 10,000 req/s
  - Error rate under 0.5%
  - Fan-out lag under 5 s
  - Survive a celebrity post that invalidates most cached timelines, and a posting burst
  - Stay within $4.20/hr

