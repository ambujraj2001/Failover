slug: the-celebrity-shard
kind: lab
title: The celebrity shard
difficulty: hard
day: 21
summary: One pop star's post sends half of all traffic to a single shard. Adding shards barely helps; change how the hot key is placed.
topics: [sharding, shard-keys, hot-partitions, hot-keys, partitioning]
company_tags: [Twitter, Instagram, Discord]
estimated_minutes: 30
incident: "SEV-2 · p99 1.0 s on /posts/:id · posts-db shard 3 at 107% · shards 0, 1, 2 under 30%"

brief_beginner: |
  You run **Murmur**, a social app. Posts, likes and comments live in PostgreSQL, split across
  **4 shards** (four separate databases). Each row goes to a shard chosen by hashing the author's
  user id, so on a normal day every shard gets roughly a quarter of the traffic.

  Tonight a pop star with 90 million followers posted. **Half of all requests**, 2,500 per
  second, are now about that one post: people opening it, liking it, commenting on it. Because
  everything about her lives on the shard her user id hashes to, that one shard gets half the
  traffic plus its normal quarter of everyone else. It is melting. The other three are bored.

  This is a **hot key** (one key that gets far more traffic than the rest) causing a **hot
  shard**. Adding more shards spreads *everyone else* thinner, but the celebrity is still one key,
  so she still lands on one shard.

  **Your job:** spread the celebrity's traffic so no single shard carries it, without paying for
  a pile of extra databases.

brief_expert: |
  5,000 rps, 60/40 read/write, Zipf-heavy: `hot_key_share = 0.5` (one author's post). posts-db is
  4 × PostgreSQL large (~3,500 units/s each) sharded by `hash(user_id)`. Hottest-shard share =
  hot + (1 − hot)/N = 62.5%, i.e. ~3,750 units/s on one node (writes cost 1.5) while the others
  idle at ~25%.

  N → 8 gives 56%, N → 16 gives 53%: diminishing returns at 2–4× the cost. Replicas help reads
  only, and 40% of this traffic is likes and comments. A cache absorbs reads of the post but not
  the writes. Fix the key distribution: split hot keys across shards (key salting /
  hot-key-aware placement) so the hottest shard sees ≈ 1/N. Consider a cache only as a complement.

glossary:
  - term: Shard
    meaning: One of several independent databases that each hold part of the data, so no single machine has to hold or serve all of it.
  - term: Shard key
    meaning: The value used to decide which shard a row lives on, here the user id. A bad choice sends most traffic to one place.
  - term: Hot key
    meaning: A single key (one user, one post) that receives a large share of all traffic.
  - term: Key salting
    meaning: Splitting one hot key into several sub-keys (post:42#0 … post:42#7) spread over different shards, and combining them on read.
  - term: Consistent hashing
    meaning: A way to map keys to shards so adding a shard moves only a small share of keys. It balances many keys; it cannot split one.

requirements:
  - p99 latency under 75 ms while the celebrity post is hot
  - Error rate under 0.5%
  - Stay within $3.60/hr (doubling or quadrupling the shard count does not fit)

