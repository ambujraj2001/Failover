hints:
  - Run the test and compare the shards. Is the database as a whole out of capacity, or is one shard doing far more than its share?
  - Work out the hottest shard's share with 4, 8 and 16 shards when one key gets 50% of the traffic. Does adding shards ever get it close to 1/N? What would have to change instead?
  - Change the shard key to the option that splits hot keys across shards and keep 4 shards. A cache in front of the reads is a fine extra, but remember that 40% of this traffic is likes and comments, and a cache cannot absorb writes.

editorial: |
  ### Why it broke
  With `hash(user_id)`, everything about one author lives on one shard. The hottest shard
  receives the celebrity's 50% plus a quarter of everyone else:
  **0.5 + 0.5 / 4 = 62.5%** of ~6,000 units/s (3,000 reads + 2,000 writes × 1.5) ≈ **3,750
  units/s** on a node that does ~3,500. It sits at **107%**, queries queue, API threads pile up
  behind it: **p99 ~1 s and 6% errors**, while three shards are at ~25%.

  ### Why more shards barely help
  | shards | hottest share | hottest shard busy | p99 | cost |
  |---|---|---|---|---|
  | 4 | 62.5% | 107% | 1,030 ms | $3.33/hr |
  | 8 | 56% | 96% | 428 ms | $4.89/hr |
  | 16 | 53% | 91% | 179 ms | $8.00/hr |

  The `(1 − hot)/N` term shrinks; the `hot` term does not. You can never shard a single key
  below one shard.

  ### The fix: split the hot key
  Hot-key-aware placement appends a small salt to keys detected as hot
  (`post:9001#0 … post:9001#3`) so their rows and counters spread over every shard. Writes go
  to a random sub-key (likes become per-shard counters), reads fan out to the N sub-keys and sum.
  The hottest shard now sees **1/4** of the load: ~1,500 units/s, **43% busy**, p99 **59 ms**,
  on the same four shards at the same price.

  The cost is complexity: the system has to detect hot keys (counters, sampling), reads of a hot
  key become scatter-gather, and "how many likes" becomes an aggregation that is usually cached.

  ### The trap: fixing only the reads
  A Redis cache in front of the post looks attractive, and on the visible test it even passes
  (hit ratio ~87%, hottest shard at 75%, p99 70 ms). But the cache only removes reads. The
  celebrity's likes and comments still hash to one shard, so when a bigger star takes 70% of the
  traffic, that shard climbs back near 90% and p99 goes to ~200 ms. When the post goes viral (+40%
  traffic) the shard saturates again. Both hidden tests probe exactly this. Read replicas fail the
  same way (and add async staleness on top).

  ### Alternatives and why not
  - **More shards**: diminishing returns, as the table shows, and 2–4× the database bill.
  - **xlarge shards**: absorbs it (~47% busy) for ~$4.76/hr; it treats the symptom and the next,
    bigger celebrity breaks it again.
  - **Range sharding by time**: every new like and comment goes to the newest shard: a hot shard
    by construction (p99 ~2 s in the simulator).
  - **Dedicated shard for celebrities**: workable (many social networks do a version of it), but
    one shard per hot key still caps out; salting scales with N.

  ### Interview takeaway
  A shard key balances *keys*, not *traffic*. Expect power-law skew (celebrities, viral posts,
  big tenants), detect hot keys, and split them (salting, fan-out on read, per-shard counters),
  with caching for hot reads as a complement rather than the fix.
