slug: design-chat-app
kind: problem
title: Design a chat app
difficulty: medium
day: 14
summary: Design WhatsApp-style 1:1 and group messaging. Sends are a write firehose, history reads are cacheable, and servers die mid-conversation.
topics: [chat, websockets, message-queue, fan-out, ordering, caching, health-checks]
company_tags: [Meta, WhatsApp, Slack, Discord, Microsoft, Amazon, Uber]
estimated_minutes: 50
incident: "Launch review · 50M DAU · 40B messages/day at maturity · design due Friday"

brief_beginner: |
  You are building **Natter**, a messaging app. People send messages to one friend (**1:1 chat**)
  or to a group of up to 500 people. When you open a chat, the app loads the most recent messages
  (the **history**). Messages must arrive in order, must never disappear, and should show
  "delivered" and "read" ticks.

  Think of a post office that never closes. Every message is a letter that must be logged,
  sorted and delivered to every person in the chat, including people who are asleep (offline)
  and will collect their mail later.

  At peak you handle **4,000 requests per second**. Unlike most apps, a large share of them are
  **sends** (40%), not reads. Today the chat servers write every message straight into one
  database and wait for it to finish before replying. The database cannot keep up, so sending
  feels slow and some messages fail.

  Some words you will need. A **message queue** is a durable waiting line: the server drops the
  message in, gets an instant "got it", and background **workers** take messages out and do the
  slow work (saving, delivering to each group member). **Sharding** splits one big database into
  several smaller ones, each holding a slice of the conversations. A **health check** is the load
  balancer regularly asking each server "are you alive?" and skipping the ones that do not answer.

  **Your job:** design the backend so sends are acknowledged fast and never lost, history loads
  quickly, and the service keeps working when a server crashes or traffic bursts. Then write a
  design note covering the parts a database diagram cannot show: connections, ordering and delivery.

brief_expert: |
  **Functional:** 1:1 and group chat (≤500 members), message history with pagination, delivery and
  read receipts, online presence, offline delivery via push notification. Media upload is out of
  scope.

  **Non-functional:** send ack p99 < 150 ms, no message loss once acked, per-conversation ordering,
  history load p99 < 150 ms, 99.95% availability.

  **Scale:** 50M DAU × ~40 messages/day ≈ 2B messages/day ≈ 23k/s average. This exercise models one
  regional cell at peak: **4k rps, 40% sends, 60% history/sync reads**; ~85% of reads are recent
  history (cacheable), the rest are deep scroll-back. Storage: 2B × ~200 B ≈ 400 GB/day before
  replication.

  The starter writes synchronously to one PostgreSQL. Decouple the send path (durable log, workers
  for persistence and fan-out), cache recent history, and size the message store for the write rate.
  Expect instance failures and bursts in the hidden tests.

glossary:
  - term: WebSocket
    meaning: A connection that stays open between the phone and the server, so the server can push new messages instantly instead of the phone asking "anything new?" every few seconds.
  - term: Message queue
    meaning: A durable waiting line (Kafka, SQS). Producers add messages and get an instant acknowledgement; workers process them at their own pace.
  - term: Fan-out
    meaning: Turning one sent message into one delivery per recipient. A message to a 500-person group fans out to 499 deliveries.
  - term: Sharding
    meaning: Splitting data across several independent databases by a key, such as conversation ID, so each one handles a slice of the traffic.
  - term: Health check
    meaning: The load balancer probes each server every few seconds and stops sending traffic to any that fail to answer.

requirements:
  - p99 latency under 150 ms at 4,000 req/s (40% sends)
  - Error rate under 0.5%
  - Queue lag under 5 s (messages are persisted within seconds)
  - No lost messages, even when a server dies or traffic bursts
  - Stay within $3.10/hr

