solution:
  nodes:
    - {id: users, type: users, position: {x: 0, y: 160}}
    - {id: lb, type: load_balancer, config: {health_checks: true}, position: {x: 240, y: 160}}
    - {id: api, type: app_server, label: Chat API, config: {size: large, instances: 9}, position: {x: 480, y: 160}}
    - {id: redis, type: cache, label: Recent history, config: {memory_gb: "16", ttl_s: 3600, stampede_protection: true}, position: {x: 720, y: 0}}
    - {id: queue, type: queue, label: Message log, config: {partitions: 4}, position: {x: 720, y: 320}}
    - {id: workers, type: worker, label: Persist + fan-out, config: {size: large, instances: 3}, position: {x: 960, y: 320}}
    - {id: db, type: database, label: Messages DB, config: {size: medium, indexes: "id, conversation_id", shards: 3, shard_key: hash_user}, position: {x: 1200, y: 160}}
  edges:
    - {source: users, target: lb}
    - {source: lb, target: api}
    - {source: api, target: redis}
    - {source: api, target: db}
    - {source: api, target: queue}
    - {source: queue, target: workers}
