slug: final-simulation
kind: lab
title: Final simulation
difficulty: hard
day: 30
checkpoint: true
summary: A stadium tour goes on sale and everything breaks at once. Turn a single-server ticketing site into a system that survives spikes, dead databases, cold caches, bots and a checkout rush.
topics: [end-to-end-design, capacity-planning, failover, queues, rate-limiting, caching, cdn, autoscaling]
company_tags: [Ticketmaster, Amazon, Google]
estimated_minutes: 60
incident: "SEV-1 · on-sale opened at 10:00 · 87% of requests failing · single API instance at 405% · fans cannot load the seat map"

brief_beginner: |
  You run **Gatehouse**, a ticketing site. Today at 10:00 tickets go on sale for a stadium tour.
  Normally **5,000 requests per second** arrive: half are images and scripts, most of the rest
  are fans browsing events and seat maps, and some are orders. When the sale opens, traffic
  climbs to **2.5×** within seconds and stays there for most of a minute.

  Your current system is the simplest thing that works on a quiet day: one big API server and
  one database. On sale day it fails in the first second, and that is before anything else goes
  wrong. Things *will* go wrong: during past sales the database primary crashed, the cache came
  back empty, scalpers pointed bots at the site, and a wave of fans all clicked "buy" at once.

  This is the capstone. Every tool from the last 29 days is on the palette: CDN, load balancer,
  autoscaling, cache, replicas and failover, rate limiting, queues and workers. You do not need
  the biggest version of each; you need the right ones, sized for the job, within a tight budget.

  **Your job:** keep the sale fast and almost error-free through the opening spike *and* through
  whatever breaks next.

brief_expert: |
  5,000 rps baseline: 50% static, dynamic 85/15 read/write, 90% of reads cacheable (3 GB hot set).
  On-sale: 2.5× over 8 s, held 40 s (peak ~12,500 rps, ~940 orders/s). Starter: Users → one xlarge
  API → PostgreSQL large. No redundancy anywhere.

  Hidden tests combine the on-sale peak with: PostgreSQL primary death (plus two API instances
  lost), a cache flush at peak, a 10,000 req/s bot wave, and a checkout rush (30% writes). SLO
  throughout: p99 < 70–80 ms, errors < 0.3% (< 0.75% in the test where API instances die), no
  lost orders, order backlog drained within ~30 s.

  Design each layer for its failure: static at the edge, cacheable reads in Redis with stampede
  protection, an app tier with N+2 headroom behind health-checked load balancing and a per-client
  rate limit, orders accepted into a durable queue and drained by workers at a rate the primary
  can take, and a replicated primary with automatic failover and RPO = 0. The budget leaves
  little room for oversizing.

glossary:
  - term: Defense in depth
    meaning: Several independent safeguards, so one failure (or one missing piece) does not take the whole system down.
  - term: Blast radius
    meaning: How much of the system a single failure affects. Good designs keep it small.
  - term: Graceful degradation
    meaning: Under stress, keep the core working (browse, buy) even if something non-essential is slower or briefly unavailable.
  - term: SLO
    meaning: Service level objective. The target you promise, e.g. "p99 under 70 ms and fewer than 0.3% errors".
  - term: Capacity plan
    meaning: Peak load per layer, plus headroom for failures, turned into a number of machines and a cost.

requirements:
  - Through the on-sale peak, p99 under 70 ms and errors under 0.3%
  - "Survive whatever breaks next: a dead database primary, a cold cache, bots and a checkout rush"
  - No lost orders; order backlog clears within about 30 seconds
  - Stay within $3.40/hr

budget: 3.4
palette: [cdn, load_balancer, app_server, cache, database, queue, worker]

