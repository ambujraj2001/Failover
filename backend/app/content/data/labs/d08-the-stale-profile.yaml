hints:
  - The system is fast and error-free, so look at the stale reads number. Which components keep copies of a profile, and how does each copy learn about a change?
  - Redis keeps serving the old profile until its TTL runs out. A shorter TTL only shrinks the window. Look at the cache's data settings for something that removes the entry when the row changes.
  - Turn on invalidate-on-write in Redis. That still leaves about 0.2% stale reads from replicas that lag behind the primary. Switch replication to synchronous (or stop reading from replicas), then compare p99 before and after, especially when writes increase.

editorial: |
  ### Why it broke
  Two separate copies were serving old data:

  1. **The cache never invalidates.** With `invalidate_on_write` off, an edited profile stays in Redis
     until its 300 s TTL expires. Hot profiles change often (14% of traffic is writes), so about
     **38% of reads** return an outdated profile.
  2. **Async replicas lag.** Two-thirds of the database reads go to replicas that apply changes a
     moment late, about **1%** of those reads miss a recent write (more when the primary passes 70%
     busy).

  Nothing was slow or failing. That is what makes consistency bugs nasty: dashboards stay green while
  users lose trust.

  ### The fix, and its price
  ```
  Redis:      invalidate_on_write: true     (delete the key when the row changes)
  PostgreSQL: replication: sync             (commit waits for replicas)
  ```
  Invalidation alone takes stale reads from **38% → 0.21%**. Synchronous replication removes the rest:
  **0%**. Now look at latency:

  | | async | sync |
  |---|---|---|
  | p99, normal afternoon | 49.5 ms | **54 ms** |
  | p99, redesign launch (22% writes) | 79 ms | **104 ms** |

  Every write now waits for both replicas, and that wait is multiplied by queueing on the primary. At
  ~60% busy it costs a few milliseconds; at ~83% busy (the redesign launch) it costs about 25 ms at p99.
  This is the consistency vs latency trade-off in miniature, the same one PACELC describes.

  ### The trap
  The hidden tests double the write share and add an evening spike. They catch two near-miss fixes:
  * **A shorter TTL** instead of invalidation: a 5 s TTL still serves ~4% stale reads and drops the hit
    ratio to ~62%, so the database works much harder.
  * **Dropping the replicas** on the medium primary: it now serves every read and runs at ~97%; p99
    goes to ~300 ms on a normal afternoon and requests fail during the redesign launch.

  ### Alternatives
  * **Read from the primary only, with a bigger primary.** A large primary without replicas passes too
    (and costs less here), because it is fully consistent by definition. You give up read scale-out and
    a warm standby.
  * **Read-your-writes routing.** Send a user's own reads to the primary for a few seconds after they
    write, and let everyone else read from async replicas. Most real systems do this; it keeps writes
    fast and fixes the complaint that matters (seeing *your own* change).
  * **Write-through caching** updates the cached value on write instead of deleting it. That is fine
    for simple values, but racy when two writers overlap.

  ### Interview takeaway
  Name the consistency your users need (here: read-your-writes for your own profile), then pick the
  cheapest mechanism that provides it. Always invalidate caches on write, and say out loud what
  synchronous replication does to commit latency.
