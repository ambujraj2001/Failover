slug: the-stale-profile
kind: lab
title: The stale profile
difficulty: medium
day: 8
summary: Users change their profile and keep seeing the old one. A cache that never invalidates and lagging async replicas both serve old data. Make reads consistent, and pay for it in write latency.
topics: [consistency, replication-lag, cache-invalidation, read-your-writes]
company_tags: [LinkedIn, Meta, Discord]
estimated_minutes: 25
incident: "SEV-3 · support tickets: 'I changed my name and it still shows the old one' · stale reads 38%"

brief_beginner: |
  You run **Loopline**, a community app. People edit their profile (display name, photo, bio) and
  then look at it. Lately the support inbox is full of the same complaint: *"I changed my name and it
  still shows the old one."* Some users change it three times, thinking it did not save.

  The site is fast, so what is wrong? Two things keep **copies** of profiles:
  * **Redis**, a cache. When a profile changes, nobody deletes the old copy from Redis, so it is
    served until it expires five minutes later.
  * Two **read replicas**, copies of the database. They receive changes a moment after the main
    database (asynchronously), so a read that lands on a replica right after a save can miss it.

  Imagine a noticeboard in the lobby with photocopies in every corridor. You update the lobby board,
  but the corridor copies are refreshed "when someone gets round to it". Making every copy update
  before you walk away fixes it, but now each update takes longer.

  **Your job:** stop serving outdated profiles. Watch what your fix does to response times, because
  consistency is not free.

brief_expert: |
  3k rps, 86% reads (70% cacheable profile reads, 30% per-viewer queries), 14% writes. Cache-aside
  Redis with `invalidate_on_write` off and a 300 s TTL serves stale entries for every hot profile
  that changed (~38% of reads). PostgreSQL medium + 2 async replicas: ~1% replica lag, worse past
  70% primary utilisation.

  Target: stale reads ≤ 0.05%. Invalidate on write; then either synchronous replication (adds ~3 ms
  × queueing factor to every commit, so it hurts more on a busy primary) or stop serving reads from
  replicas (the primary then carries all reads). Check p99 under a write-heavy hour: synchronous
  commit latency grows with primary load.

glossary:
  - term: Stale read
    meaning: A read that returns an old version of data that has already been changed.
  - term: Cache invalidation
    meaning: Deleting (or updating) the cached copy when the real data changes, so the next read fetches the new version.
  - term: Asynchronous replication
    meaning: The primary confirms a write immediately and sends it to replicas afterwards. Fast, but replicas can briefly lag behind.
  - term: Synchronous replication
    meaning: The primary waits until replicas have the write before confirming it. No lag, but every write takes longer.
  - term: Read-your-writes
    meaning: A guarantee that after you change something, you will see your own change on the next read.

requirements:
  - Stale reads at or below 0.05%
  - p99 latency under 65 ms at 3,000 req/s
  - Error rate under 0.2%
  - Stay within $1.90/hr

budget: 1.90
