slug: design-google-docs
kind: problem
title: Design Google Docs
difficulty: hard
day: 16
summary: Design real-time collaborative editing. Every keystroke is a write, edits to one document must converge, and the op log outgrows any single database.
topics: [collaborative-editing, operational-transform, crdt, websockets, sharding, message-queue, versioning]
company_tags: [Google, Microsoft, Notion, Figma, Dropbox, Atlassian, Meta]
estimated_minutes: 60
incident: "Launch review · 30M DAU · 6k edit ops/s per cell at peak · design due Friday"

brief_beginner: |
  You are building **Quill**, a document editor where several people can type in the same
  document at the same time and see each other's cursors move live. Every keystroke, deletion
  or formatting change is an **edit operation** ("insert 'a' at position 120").

  Imagine five people editing one shared paper notebook through a single helper. Alice says "add
  a word on line 3" while Bob says "delete line 2". If the helper applies them in a different
  order on different copies, the copies end up different. The helper's real job is to put
  everyone's changes in one agreed order and adjust each change so it still means what the
  person intended. That adjusting is what **OT** and **CRDTs** are about (see the glossary).

  This workload is unusual: most systems mostly read, but here **three out of four requests are
  writes**. At peak a single region receives **8,000 requests per second**, of which 6,000 are
  edit operations. Every one must be saved, in order, and never lost. Today each edit is written
  straight into one database, which cannot keep up.

  Two more words. A **queue** (here, an **op log**) is a durable list of edits in arrival order that
  background workers save at their own pace. **Sharding** splits the data across several databases
  by document, so each database handles only some of the documents.

  **Your job:** design a backend that accepts edits quickly, saves every one of them, loads
  documents fast, and keeps working when a collaboration server crashes or everyone starts typing
  at once. Then explain in writing how concurrent edits are merged.

brief_expert: |
  **Functional:** create/open/edit documents concurrently, live cursors and presence, version
  history with restore, comments, sharing permissions. Offline editing is a stretch goal.

  **Non-functional:** local echo is instant (client-side); remote edits visible to collaborators in
  < 200 ms; server ack p99 < 120 ms; **no acknowledged edit is ever lost**; all replicas of a
  document converge; 99.95% availability.

  **Scale:** 30M DAU, ~5M concurrently editing at peak, clients batch keystrokes into ops every
  ~100–200 ms. Modelled cell: **8k rps, 75% edit ops, 25% document opens and history reads**
  (~70% of reads are cacheable snapshots). One op ≈ 100 B; ~500M ops/day/cell ≈ 50 GB/day of op
  log before compaction into snapshots. Some documents (company all-hands notes) draw hundreds of
  editors at once.

  The starter writes every op synchronously to one PostgreSQL: 6,000 writes/s × 1.5 units is more
  than the largest node can take. Put a durable, document-partitioned op log on the write path,
  persist through workers into a store sharded by `doc_id`, and cache snapshots. Hidden tests kill
  collaboration servers and burst traffic.

glossary:
  - term: Operational Transformation (OT)
    meaning: A server puts all edits to a document in one order and rewrites ("transforms") each incoming edit against the ones it missed, so "insert at 120" becomes "insert at 125" if someone typed five characters earlier. Google Docs uses OT.
  - term: CRDT
    meaning: Conflict-free replicated data type. Every character gets a unique, ordered ID, so edits can be merged in any order and all copies still converge, without a central server deciding the order. Used by Figma-style and offline-first editors.
  - term: Op log
    meaning: The append-only list of every edit to a document, in order. The current document is the last snapshot plus the ops after it.
  - term: Snapshot
    meaning: A saved full copy of a document at some version, so opening it does not require replaying millions of ops.
  - term: Sharding
    meaning: Splitting data across several independent databases by a key (here, the document ID) so each handles a fraction of the writes.

requirements:
  - p99 latency under 120 ms at 8,000 req/s (75% edits)
  - Error rate under 0.5%
  - Op log lag under 3 s; no lost edits, ever
  - Survive two collaboration servers crashing and a 50% burst of typing
  - Stay within $8.20/hr

