slug: one-server-one-bad-day
kind: lab
title: One server, one bad day
difficulty: easy
day: 1
summary: A homework planner runs on a single small server. Term starts, traffic climbs, and it falls over. Scale out behind a load balancer.
topics: [horizontal-scaling, load-balancing, capacity, redundancy]
company_tags: [Amazon, Shopify]
estimated_minutes: 15
incident: "SEV-2 · 76% of requests failing on Brightboard API · single instance CPU 300%"

brief_beginner: |
  You run **Brightboard**, a homework planner used by schools. Students open it to check what is
  due, and teachers post assignments. All of it runs on **one small server**.

  On a quiet evening that server sees about **300 requests per second** and copes fine. Tonight is
  the first day of term: within half a minute traffic climbs to **750 requests per second** and
  stays there. One small server can only handle about **250**. Requests start piling up, pages take
  seconds to load, and most students get an error.

  Think of a shop with a single cashier. When the queue triples, you do not hire a cashier who
  scans three times faster (that is expensive and has a ceiling). You open more tills, and you put
  someone at the door pointing each customer to a free one. In system design, the extra tills are
  extra **instances** of your server, and the person at the door is a **load balancer**.

  **Your job:** keep Brightboard fast on the first night of term by running several servers instead
  of one, and make sure customers can actually reach all of them.

brief_expert: |
  Single `small` app instance (250 rps of unit work), wired directly from Users. Load ramps from
  300 to 750 rps over 10 s and holds for 40 s; 90% reads, 10% writes (1.3 units each), so the peak is
  ~770 work units, about 3x one instance. PostgreSQL (medium) is at ~50% and is not the bottleneck.

  Scale horizontally behind an L7 load balancer. Size the pool so peak utilisation stays near 60%
  (tail latency climbs steeply past ~75%), and assume an instance can die at peak: N+1 matters more
  than raw throughput. A single bigger box is a valid capacity fix but a single point of failure.

glossary:
  - term: Instance
    meaning: One running copy of your server program. Running several copies lets you handle more requests.
  - term: Load balancer
    meaning: A component that receives every request and passes it to one of your instances, spreading the work evenly.
  - term: Horizontal scaling
    meaning: Handling more load by adding more machines, rather than making one machine bigger (vertical scaling).
  - term: Throughput
    meaning: How many requests per second a system can complete.
  - term: p99 latency
    meaning: 99 out of 100 requests finish faster than this. It describes your unluckiest users.

requirements:
  - p99 latency under 70 ms while traffic climbs to 750 req/s
  - Error rate under 0.5%
  - Stay within $0.60/hr

budget: 0.60
palette: [load_balancer, app_server, database]

starter:
  nodes:
    - {id: users, type: users, position: {x: 0, y: 120}}
    - {id: api, type: app_server, label: Brightboard API, config: {size: small, instances: 1}, position: {x: 240, y: 120}}
    - {id: db, type: database, label: PostgreSQL, config: {size: medium}, position: {x: 480, y: 120}}
