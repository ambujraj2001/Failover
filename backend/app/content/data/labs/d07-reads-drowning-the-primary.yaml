hints:
  - Run the test and compare Redis with PostgreSQL. Redis has a great hit ratio, so why is the database still drowning? Look at how much of the read traffic is cacheable.
  - Try the biggest database size first and read its utilisation. When one machine is not enough even at its largest, what else does the database node offer for read-heavy load?
  - Add read replicas. Reads are shared evenly between the primary and every replica, but every write still lands on the primary. An xlarge primary with one replica (or a large primary with several) works for today; then ask what happens to the primary when the share of writes doubles.

editorial: |
  ### Why it broke
  Only **10%** of reads are cacheable (the shared exercise library). Redis hits ~97% of those, but
  that saves the database barely 830 queries/s. The other **~7,700 personalised reads/s**, plus
  **~450 writes/s** at 1.5 units each, all land on one PostgreSQL node: about **8,400 units/s**.

  * `large` (3,500 qps): **240%** busy. 59% of requests fail; the survivors see p99 ≈ 2.9 s.
  * `xlarge` (8,000 qps): still **105%**. About 4% of requests fail and p99 sits near 800 ms.

  There is no bigger box. This is the vertical ceiling.

  ### The fix: read replicas
  ```
  API ──reads──→ primary + replica   (split evenly)
      └─writes─→ primary only
  ```
  With an `xlarge` primary and **one replica**, each node takes ~3,860 reads/s; the primary also takes
  all writes (~675 units), so it runs at ~**57%** and the replica at ~48%. p99 drops to about
  **70 ms** with no errors, for **$4.01/hr**.

  Note that replicas are *not* cheaper per query in this catalogue: large + 3 replicas costs the same
  as xlarge + 1. You add them because a single node cannot go further, and because each copy is
  also a warm standby.

  ### The trap: replicas do not help writes
  The hidden test raises writes from 5% to 12% of traffic (watches syncing workouts). A design built
  from a `large` primary and three replicas passes today, but its primary now carries
  ~1,620 write units **plus** a quarter of all reads: about 97% busy, and p99 jumps past 400 ms.
  Adding a fourth replica only trims the read share (p99 still ≈ 115 ms). The xlarge primary stays
  near 65%. Size the primary for *all* writes plus its share of reads.

  Replication also has a consistency cost: asynchronous replicas lag slightly, so a few reads return
  slightly old data (~0.45% here). Tomorrow's lab is about exactly that.

  ### Alternatives
  * **Cache the personalised data** per user with short TTLs. This helps if the same user reloads often,
    but the working set is every active user and the data changes after each workout.
  * **Precompute dashboards** (materialised views or a summary table updated on write) to turn
    several reads into one.
  * **Sharding** by `user_id` scales writes as well as reads, at much higher complexity. Reach for it
    when the primary's *write* load hits the ceiling.

  ### Interview takeaway
  Read-heavy and uncacheable means read replicas: reads scale with the number of copies, writes do not.
  Always state the primary's load as writes + reads ÷ (replicas + 1), and mention replication lag.
