slug: reads-drowning-the-primary
kind: lab
title: Reads are drowning the primary
difficulty: medium
day: 7
summary: A fitness app's personalised dashboards flood PostgreSQL with reads a cache cannot absorb. Even the biggest instance is not enough. Spread reads across replicas.
topics: [read-replicas, database-scaling, read-write-split, capacity]
company_tags: [Strava, Meta, Google]
estimated_minutes: 25
incident: "SEV-1 · 59% of requests failing on Fernway dashboards · PostgreSQL primary 240% busy · Redis hit ratio 97% but idle"

brief_beginner: |
  You run **Fernway**, a fitness app. When someone opens it, the dashboard shows *their* runs,
  *their* heart-rate zones and *their* weekly goals. Every one of those numbers comes from a
  database query that is different for each person.

  At **9,000 requests per second**, almost all of them reads, the single database is asked for far
  more work than it can do. Last month someone added a Redis cache, and it works well, but only for
  the 10% of data that is shared (like the exercise library). The personal stats cannot be cached
  usefully, so they all still land on the database. Even the biggest database you can buy would be
  over capacity.

  Think of a library with one librarian answering every question. You cannot hire a librarian who
  thinks infinitely fast, but you can set up extra desks with copies of the catalogue so others can
  answer *questions*. Only the head librarian is allowed to *change* the books, though. Those copies
  are **read replicas**.

  **Your job:** spread the read traffic over several copies of the database so no single machine is
  overwhelmed, and remember that every change still has to go through one place.

brief_expert: |
  9k rps, 95% reads, but only 10% of reads are cacheable (per-user aggregates); Redis hits ~97% of
  those and is irrelevant to the bottleneck. ~7.7k indexed point reads/s plus ~450 writes/s (1.5 units
  each) land on one primary: ~8.4k units/s. Large (3.5k) is at 240%; xlarge (8k) is the vertical
  ceiling and still over.

  Add read replicas: reads spread evenly over primary + replicas, writes stay on the primary. Price per
  qps is the same whether you scale up or out, so the reason is the ceiling, not cost. Size the
  primary for 100% of writes plus its share of reads. The write share will not stay at 5%.

glossary:
  - term: Primary
    meaning: The main database server. Every write (insert, update, delete) must go to it.
  - term: Read replica
    meaning: A copy of the database that receives the primary's changes and can answer read queries, but not writes.
  - term: Read/write split
    meaning: Sending reads to replicas and writes to the primary, so reads can scale by adding copies.
  - term: Vertical ceiling
    meaning: The point where you cannot buy a bigger single machine. After that you must scale out.

requirements:
  - p99 latency under 80 ms at 9,000 req/s
  - Error rate under 0.5%
  - Stay within $4.40/hr

budget: 4.40
