hints:
  - >-
    Count where the work goes. 36,000 of the 40,000 requests per second are video segments, and each
    one passes through an API server on its way from storage. Video segments are immutable files.
    What component exists precisely to serve immutable files close to users, and where should it
    fetch from on a miss?
  - >-
    Put a CDN in front of everything, with object storage as the origin for segments and the load
    balancer behind it for API calls. Then look at the metadata database: ~2,800 reads/s and
    ~1,200 writes/s land on it. Reads are cacheable; writes (uploads, likes, progress) do not need to
    finish before the user gets a response.
  - >-
    Cache metadata with a long TTL and stampede protection (one hidden test starts with an empty
    cache). Send writes through a queue to a fixed pool of workers: enough workers to keep up with
    an upload surge, few enough that a premiere's burst of writes cannot push the primary past ~85%.

editorial: |
  ### 1. Requirements (5 minutes)
  Split the problem early: **upload and processing** (write path, latency in minutes is fine),
  **playback** (read path, latency in milliseconds, bandwidth in terabits), and **metadata**
  (classic read-heavy service). Clarify: max upload size, which devices, live or VOD only (VOD
  here), and whether recommendations are in scope (no).

  ### 2. Estimation
  - Watch: 1B hours/day × 3,600 s × ~3 Mbps ÷ 86,400 s ≈ **125 Tbps average**, ~400 Tbps peak.
    No origin can serve that; the CDN must hit 95%+ and sit inside ISPs (Google Global Cache, Netflix
    Open Connect).
  - Segment requests: with 4 s segments, 125 Tbps ÷ 3 Mbps ≈ 40M concurrent streams → **10M segment
    requests/s**.
  - Upload: 500 h/min ≈ 30k hours/hour. At ~2 GB per raw hour that is ~1.4 PB/day of originals,
    plus ~1.5x for renditions. Object storage, tiered to cold storage for the long tail.
  - Transcoding: one hour of 1080p to a 6-rung ladder takes roughly 1–2 CPU-hours per rung, so
    30k h/h of uploads needs **~200k–400k cores**. It is a batch fleet, not part of the API.
  - Metadata: ~1M req/s globally, a few KB per video, hot set fits in RAM.

  ### 3. High-level design
  ```
  upload:   client → API: create upload → pre-signed URL → resumable chunks straight to object storage
            storage event → queue "process" → workers: validate, split into GOP chunks, transcode in
            parallel (ladder × codecs), package HLS/DASH, thumbnails → write renditions to storage
            → mark video READY in metadata DB
  playback: player → API: manifest URL (signed) → CDN → object storage on miss → segments
  metadata: client → CDN (short TTL) → API → Redis → DB (on miss); counts via async events
  ```

  ### 4. Deep dives
  - **Upload pipeline.** Bytes never pass through the API: the client uploads chunks directly to
    object storage using a pre-signed, resumable URL. The API only records intent and state
    (`UPLOADING → PROCESSING → READY / FAILED`). Idempotent job ids so a retried event does not
    transcode twice.
  - **Transcoding.** Split the source at keyframes into ~10 s chunks, transcode chunks in parallel
    across workers (a 2-hour film finishes in minutes), then stitch. Produce a bitrate ladder
    (240p–4K) per codec (H.264 for reach, VP9/AV1 for efficiency on popular videos only, since AV1
    encode is ~10x more expensive). Prioritise: publish 360p and 720p first, the rest later.
  - **Adaptive bitrate.** Each rendition is cut into 2–6 s segments listed in a manifest (HLS
    `.m3u8` or DASH `.mpd`). The player estimates throughput and buffer level and chooses the next
    segment's rung. Shorter segments adapt faster but cost more requests and worse compression.
  - **CDN strategy.** Segments are immutable: long cache TTL, content-addressed paths. Popular
    videos are pushed to edge caches proactively; the long tail is served via a mid-tier cache
    (origin shield) so that misses from hundreds of edges collapse into one origin fetch. Signed
    URLs with expiry control access. Pay attention to the manifest: it is small and cacheable too.
  - **Metadata and counts.** View counts are not incremented in the metadata row on every view: send
    view events to a queue, aggregate, and update counts every few seconds.

  ### 5. What the hidden tests probe
  - **Premiere (+70%).** CDN absorbs the segment spike for free. Writes peak at ~2,000/s; four
    medium workers drain ~1,500/s, so the queue holds the excess and processing runs ~9 s behind.
    Without the queue those writes go straight to the primary and p99 jumps past 600 ms.
  - **Upload surge.** Writes run at 1,600/s for the whole minute. Too few workers and the backlog
    grows without bound.
  - **Cold metadata cache.** A new region starts with an empty Redis. Stampede protection keeps the
    database from taking the full read load while the cache warms.

  ### 6. Common mistakes
  - Uploading or streaming video bytes through application servers.
  - Treating transcoding as a synchronous step of the upload request.
  - One rendition per video ("we store the MP4"), so no adaptive streaming.
  - Incrementing view counters with a database write per view.
  - Ignoring CDN cost and the origin-shield layer when discussing a viral video.

  ### 7. What good looks like
  - **E4:** CDN + object storage for video, metadata DB with cache, async transcoding via a queue.
  - **E5:** pre-signed resumable uploads, chunked parallel transcoding, bitrate ladder and ABR
    manifests, origin shield, async counters, estimates for egress and storage.
  - **E6:** per-title encoding and codec economics (AV1 only for hot content), ISP-embedded caches,
    tiered storage and lifecycle policies, failure handling in the pipeline (poison videos, retries,
    partial ladders), cost per hour watched as the key metric.

design_prompt: |
  Answer each in a few sentences or a short sketch. Use numbers where you can.

  1. **Upload API and pipeline.** Define the endpoints a client uses to upload a 4 GB video over a
     flaky mobile connection. Trace the video from the first byte to "watchable", naming each
     component and the state stored at each step.
  2. **Transcoding.** How do you turn one upload into renditions for every device, and how do you
     make a two-hour video available in minutes rather than hours? Estimate the compute needed for
     500 hours of uploads per minute.
  3. **Adaptive bitrate playback.** Explain manifests, segments and how the player chooses quality.
     What segment length would you pick and why?
  4. **CDN strategy.** How do you serve ~125 Tbps on average? Cover cache keys and TTLs, what
     happens when a new video goes viral (cold edges, origin protection), access control for
     private videos, and the cost trade-offs.
  5. **Metadata and counters.** Describe the data model for videos and channels, how the watch
     page stays fast, and how you count billions of views per day without a write per view.
