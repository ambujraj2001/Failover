slug: design-youtube
kind: problem
title: Design YouTube
difficulty: hard
day: 22
summary: A video platform where 90% of requests are video segments. Serve bytes from a CDN backed by object storage, push uploads through a queue to processing workers, and cache the metadata.
topics: [cdn, object-storage, transcoding, adaptive-bitrate, upload-pipeline, message-queue, caching, media]
company_tags: [YouTube, Netflix, TikTok, Vimeo, Twitch]
estimated_minutes: 50
incident: "Architecture review · 2B monthly users · 500 hours uploaded per minute"

brief_beginner: |
  You are building a video site. People do two very different things on it:

  - **Watch.** A video is not one big file. The player downloads it in small pieces of a few
    seconds each, called **segments**. Nine out of every ten requests your system receives are
    "give me the next segment".
  - **Upload.** A creator sends a large raw file. Before anyone can watch it, the system has to
    **transcode** it: convert it into several sizes and qualities (240p up to 4K), so a phone on a
    train and a TV on fibre both get something that plays smoothly. Transcoding is slow, heavy work.

  Around that sits the small stuff: titles, thumbnails, view counts, likes. That is **metadata**,
  read constantly and changed rarely.

  Today every request, including every video segment, goes through your API servers, which fetch
  the bytes from storage and pass them on. The servers are drowning in video bytes and barely get
  to the real work.

  **Your job:** get video bytes off your servers entirely, make uploads and processing happen in
  the background without slowing anyone down, and keep metadata fast. Then explain how upload,
  transcoding and adaptive streaming work end to end.

brief_expert: |
  **Functional:** upload a video (resumable), process it into multiple renditions, stream with
  adaptive bitrate, show video metadata (title, channel, counts), record views and likes.

  **Non-functional:** 2B MAU, ~1B hours watched per day (~125 Tbps average egress, ~3x at peak),
  500 hours of video uploaded per minute. Playback start under 2 s, rebuffering under 1% of watch
  time. A new upload should be watchable within minutes. Reads dwarf writes; video bytes dwarf
  everything. Durability for originals: 11 nines.

  **Graded part:** one region at 40,000 req/s, 90% video segment requests (static). Of the dynamic
  rest, 70% are metadata reads (90% cacheable, 8 GB hot set) and 30% are writes (upload
  completions that start processing jobs, likes, watch-progress events). Keep the API tier as
  sized; the budget rules out a bigger database in place of a cache and a queue.

glossary:
  - term: CDN
    meaning: A network of servers close to viewers that keep copies of popular files, so most video bytes never travel back to your data centre.
  - term: Object storage
    meaning: S3-style storage for large files. Cheap, durable and practically unlimited, but each request is slow (~25 ms), so it sits behind the CDN.
  - term: Transcoding
    meaning: Converting an uploaded video into several resolutions, bitrates and formats so every device can play it.
  - term: Adaptive bitrate (ABR)
    meaning: The player measures your connection and picks the quality of each next segment, stepping down instead of freezing when the network slows.
  - term: Segment
    meaning: A short chunk (2–6 s) of one rendition of a video. Players download segments one after another, listed in a manifest file (HLS or DASH).

requirements:
  - "Normal day: p99 under 52 ms, error rate under 0.5% at 40,000 req/s"
  - Survive a premiere, an upload surge and a cold metadata cache (hidden tests)
  - Stay within $3.90/hr including CDN usage (the API tier stays at 9 large instances)

budget: 3.9
