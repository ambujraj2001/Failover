slug: design-uber
kind: problem
title: Design Uber
difficulty: hard
day: 23
summary: Ride matching on a stream of driver location updates. Buffer the writes, shard the geo index so hot cells cannot sink one shard, cache nearby lookups, and survive losing the database primary.
topics: [geospatial-indexing, geohash, quadtree, matching, sharding, hot-keys, message-queue, failover, consistency]
company_tags: [Uber, Lyft, DoorDash, Grab, Instacart]
estimated_minutes: 50
incident: "Design review · 5M drivers online at peak · city launch in 3 weeks"

brief_beginner: |
  When you open a ride app, you see little cars moving on the map, and when you tap "request" the
  app finds you a nearby driver within seconds. Behind that are two streams of traffic:

  - **Drivers report where they are** every few seconds. This is the bulk of all traffic, and it is
    all *writes*: "driver 42 is now here".
  - **Riders ask "who is near me?"** That is a *geo lookup*: find drivers within a few hundred metres
    of a point on the map.

  To answer "who is near me" quickly, the map is cut into small tiles called **cells** (for example
  with a **geohash**, a short code like `u4pru` that names one tile). Drivers are filed under the
  cell they are in, so a lookup only checks a few neighbouring cells instead of every driver on
  Earth.

  The catch: cells are not equally busy. When a concert ends, one cell around the stadium suddenly
  holds thousands of riders and drivers. That cell is a **hot cell**, the map version of a hot key.
  If the data is split across several databases by cell, the database holding the stadium gets
  crushed while the others are idle.

  Today all location updates and lookups go to one large PostgreSQL database. Even the biggest one
  cannot keep up with the location writes.

  **Your job:** take location updates in without overloading storage, split the data so a hot cell
  does not sink one machine, keep lookups fast, and keep working when the main database machine
  dies. Then explain how drivers and riders are actually matched.

brief_expert: |
  **Functional:** drivers send location every 4 s while online; riders see nearby drivers and
  request a ride; the system matches a rider to one available driver, the driver accepts, and both
  see each other's live position until pickup.

  **Non-functional:** 5M drivers online at peak → ~1.25M location writes/s globally; ~300k nearby
  queries/s; ~20k ride requests/s at peak. Match within ~5 s, nearby-driver p99 under 200 ms. A
  driver must never be assigned to two riders at once. Location data is ephemeral (minutes), trip
  data is durable. Demand concentrates in hot cells (airports, stadiums, downtown at 2 am).

  **Graded part:** one city cluster at 8,000 req/s with light handlers (`app_work` 0.5): 75%
  location updates (writes), 25% nearby lookups (60% cacheable for a few seconds, ~2 GB hot set),
  and the hottest cell draws 50% of keyed traffic. One hidden test kills the database primary.
  Keep the API tier as sized.

glossary:
  - term: Geohash
    meaning: A way to turn a latitude/longitude into a short string. Nearby points share a prefix, and each extra character makes the cell smaller (6 characters ≈ 1.2 km × 0.6 km).
  - term: Quadtree
    meaning: A map index that splits a square into four smaller squares, again and again, but only where there are many points. Busy areas get small cells, empty areas stay large.
  - term: Hot cell
    meaning: A map cell with far more drivers and riders than the rest, such as an airport or a stadium after a game.
  - term: Shard key
    meaning: The rule that decides which database machine a row lives on. A bad key sends most traffic to one machine.
  - term: Failover
    meaning: Promoting a replica to be the new primary when the primary dies, so writes can continue after a short pause.

requirements:
  - "Normal evening: p99 under 80 ms, error rate under 0.5%, location processing lag under 5 s"
  - Survive a stadium emptying and the loss of the database primary (hidden tests)
  - Stay within $6.00/hr (the API tier stays at 8 large instances)

