hints:
  - >-
    Do the write math first. 6,000 location updates/s at 1.5 units each is 9,000 units, more than an
    extra-large primary (8,000) can do on its own, before a single lookup. Vertical scaling has run
    out. Location updates are also fire-and-forget: the driver's phone does not need to wait for the
    index to be updated.
  - >-
    Put updates on a queue drained by workers that keep up with the update rate, and spread the
    index over several shards. Then think about which shard holds the stadium cell. With a plain hash
    of the cell, half of all keyed traffic lands on one shard. Pick a shard key that splits hot cells.
    A short-TTL cache in front of nearby lookups takes repeated queries for the same cell off the
    shards.
  - >-
    The last hidden test kills the primary. With a queue, updates are not lost; they wait. But they
    only resume if something becomes the new primary, and lookups only keep working if there is a
    copy to read from meanwhile. Give each shard a replica and automatic failover, and keep enough
    worker headroom to drain ~12 s of backlog afterwards.

editorial: |
  ### 1. Requirements (5 minutes)
  Separate the three subsystems: **location ingestion** (huge, ephemeral writes), **nearby search**
  (geo reads, latency-sensitive), and **matching / trip state** (low volume, must be correct). Ask:
  update interval (4 s), match latency target (seconds), how far to search (expanding radius), and
  whether surge pricing and ETA are in scope (mention, do not design).

  ### 2. Estimation
  - 5M online drivers ÷ 4 s ≈ **1.25M location writes/s**, ~100 B each → 125 MB/s ingest.
  - Live state: 5M × ~200 B ≈ **1 GB**. The whole live index fits in memory; durability for
    positions is optional (they are stale in 4 s anyway), so an in-memory geo index (Redis GEO,
    custom service) sharded by region beats a disk database.
  - Nearby queries ~300k/s; each touches ~9 cells (center + neighbours).
  - Ride requests ~20k/s at peak; trips are durable rows in a transactional store.

  ### 3. High-level design
  ```
  driver app → location gateway → Kafka (partition by city, cell) → indexers → geo index shards
                                                               └→ trip tracking, ETA, analytics
  rider app → API → nearby service → cache (cell → drivers, TTL ~2–5 s) → geo index shards
  ride request → matcher (per city/region) → candidate drivers from geo index
              → reserve driver (conditional write) → offer → accept → trip DB (durable)
  ```

  ### 4. Deep dives
  - **Geohash vs quadtree vs H3.** Geohash is a fixed grid: simple prefix lookups, but cells near
    boundaries need neighbour queries and density varies wildly. A quadtree adapts (split a cell when
    it holds more than ~500 drivers), which keeps hot downtown cells small, at the cost of
    rebalancing. Uber uses H3 (hexagons): uniform neighbour distances, good for ETA and pricing.
    Any of these is acceptable if you explain neighbour search and density.
  - **Matching.** The matcher pulls k nearest available drivers by ETA (not straight-line distance),
    ranks them, and offers sequentially or in small batches. Batched matching every 1–2 s over a
    region optimises globally (fewer bad assignments) at the cost of a little latency.
  - **Hot cells.** Shard by region/city first (locality, legal isolation), then within a city split
    hot cells: a finer resolution in dense cells, or replicate hot-cell reads and salt their writes.
    The cache helps reads (thousands of riders at the stadium ask about the same cell), but not the
    write side; that is why the shard key matters.
  - **Consistency of driver state.** Position can be eventually consistent. Availability cannot: a
    driver must not be assigned twice. Keep driver status (`AVAILABLE → RESERVED → ON_TRIP`) in a
    strongly consistent store owned by one matcher per region, and reserve with a compare-and-set
    (`UPDATE … WHERE status = 'AVAILABLE'`) or a short lease that expires if the driver never
    responds. The geo index may briefly show a reserved driver; the reservation step is the source
    of truth.

  ### 5. What the hidden tests probe
  - **Stadium empties.** 75% of keyed traffic in one cell. With a hash-of-cell key the hot shard
    receives 75% + 25%/4 ≈ 81% of all writes and melts. With hot cells split, each shard gets a
    quarter.
  - **Primary dies.** Without a queue, ~12 s of location updates fail outright (15% errors). With a
    queue but no failover, updates pile up forever and lag passes 30 s. With replicas and failover,
    lookups continue on the replica, writes wait ~12 s in the queue, and five large workers clear the
    backlog. Peak lag ≈ 72k queued ÷ 7,700/s ≈ 9 s.

  ### 6. Common mistakes
  - Storing live locations in the trip database and querying `ORDER BY distance` across all drivers.
  - Sharding by driver id: every nearby query then fans out to every shard.
  - Sharding by cell without addressing hot cells.
  - Matching with a read-then-write race, so two riders get the same driver.
  - Making every location update durable and synchronous.

  ### 7. What good looks like
  - **E4:** geohash cells, a location store separate from trips, a queue for updates, nearby search
    over neighbouring cells, basic matching.
  - **E5:** ingestion numbers, in-memory sharded geo index, hot-cell handling, ETA-based candidate
    ranking, compare-and-set reservation, failover behaviour stated.
  - **E6:** regional cells of the whole system (each city independent), batched global matching,
    adaptive cell sizes, explicit consistency model per data type, degradation plan (stale positions
    rather than no matches), and how to test dispatch under a simulated stadium release.

design_prompt: |
  Answer each in a few sentences or a short sketch. Use numbers where you can.

  1. **APIs.** Define the driver location update, the rider's nearby-drivers query and the ride
     request. Which are synchronous, which are fire-and-forget, and what does each return?
  2. **Geo index.** Choose geohash, a quadtree or H3. Explain how a "drivers within 500 m" query
     works including neighbouring cells, what precision you use, and where the index lives (memory
     or disk) given 1.25M updates/s.
  3. **Matching.** Walk through what happens from "request ride" to "driver accepted". How do you
     rank candidates, and what happens if the first driver ignores the offer?
  4. **Hot cells and sharding.** An airport cell holds 20x the drivers and riders of an average
     cell. What is your shard key, and how do you keep one cell from overloading one shard on both
     the write and the read side?
  5. **Consistency of driver state.** How do you guarantee a driver is never assigned to two
     riders, while keeping location updates cheap? What happens to in-flight matches if the store
     holding driver status fails over?
