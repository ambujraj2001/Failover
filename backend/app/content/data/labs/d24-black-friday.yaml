slug: black-friday
kind: lab
title: Black Friday
difficulty: hard
day: 24
checkpoint: true
summary: Doors open at midnight. Traffic triples in ten seconds, two servers die mid-rush, and most requests are product images. Profile the whole path and fix every layer that breaks.
topics: [cdn, autoscaling, caching, health-checks, capacity-planning, cost-aware-design]
company_tags: [Amazon, Shopify, Target]
estimated_minutes: 45
incident: "SEV-1 · checkout and browse down at 00:00 · 85% of requests failing · storefront CPU 337% · PostgreSQL saturated"

brief_beginner: |
  You run **Kestrel & Pine**, an online outdoor-gear store. On a normal evening about **6,000
  requests per second** arrive. Most of them (60%) are for **static files**: product photos,
  JavaScript, CSS. The rest are pages and searches, plus a few orders.

  Tonight is Black Friday. At midnight the sale opens and traffic **triples within ten
  seconds**. Twenty seconds later, two of your servers crash. Your current setup sends every
  request, photos included, to a small fleet of app servers with no spare room, which all ask
  one database. Nothing survives the first minute.

  There is no single fix here. Walk the request path and ask at each layer: *does this request
  need to come here at all?*
  - A **CDN** (content delivery network) keeps copies of static files close to users, so photos
    never reach your servers.
  - A **cache** keeps the answers to popular product pages, so the database is not asked again
    and again.
  - **Headroom and autoscaling**: enough servers for the peak *plus* a couple of failures, and a
    way to add more when the rush is longer than planned (new servers take ~20 s to boot).
  - **Health checks** let the load balancer notice a dead server and stop sending it customers.

  **Your job:** keep the store fast and almost error-free through the opening rush, within budget.

brief_expert: |
  6,000 rps baseline: 60% static, dynamic 90/10 read/write, 85% of reads cacheable (3 GB hot
  set). At 00:00 traffic ramps to 3× over 10 s and holds for 45 s; at t=35 two app instances
  die. Starter: no CDN, no cache, LB health checks off, 8 × medium app servers, PostgreSQL
  medium: everything is on the critical path and nothing has headroom.

  Work the bottlenecks in order of leverage: take static off the origin, take cacheable reads off
  the database (and protect it from a cold cache at peak), size the app tier for the peak with
  N+2 for failures, since autoscaling reacts in 5 s steps but boots in 20 s, and make sure dead
  instances are removed. Expect the next things to break: the cache restarting mid-rush and a
  scalper bot wave. Simply scaling the starter up does not fit the budget.

glossary:
  - term: CDN
    meaning: A network of edge servers that keep copies of images and scripts near users. Here ~95% of static requests are served at the edge.
  - term: Headroom
    meaning: Spare capacity kept on purpose, so a spike or a dead server does not push you over 100%.
  - term: Autoscaling
    meaning: Adding servers automatically when CPU passes a target. Useful, but new servers take time to boot.
  - term: Health check
    meaning: The load balancer pings each server every few seconds and stops sending traffic to ones that do not answer.
  - term: N+2
    meaning: Enough capacity to handle the load even after losing two servers.

requirements:
  - Through the opening rush (3× traffic, two servers dying), p99 under 100 ms
  - Error rate under 0.6%
  - Stay within $3.70/hr

budget: 3.7
palette: [cdn, load_balancer, app_server, cache, database]

