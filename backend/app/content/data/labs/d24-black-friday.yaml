tests:
  - id: doors-open
    name: Doors open at midnight
    summary: 6,000 req/s → 3× in 10 s for 45 s; two servers die at t=35s
    scenario:
      duration: 90
      base_rps: 6000
      read_ratio: 0.9
      static_ratio: 0.6
      cacheable: 0.85
      working_set_gb: 3
      spikes: [{at: 15, duration: 45, multiplier: 3, ramp: 10}]
      events: [{at: 35, type: kill_app_instance, count: 2, label: "Two Storefront instances ran out of memory"}]
    assertions:
      - {metric: p99_ms, op: lte, value: 100}
      - {metric: error_rate, op: lte, value: 0.6}
  - id: cache-restart
    name: Redis restarts mid-rush
    summary: The cache comes back empty at t=40s, at 3× traffic
    hidden: true
    scenario:
      duration: 90
      base_rps: 6000
      read_ratio: 0.9
      static_ratio: 0.6
      cacheable: 0.85
      working_set_gb: 3
      spikes: [{at: 15, duration: 45, multiplier: 3, ramp: 10}]
      events:
        - {at: 35, type: kill_app_instance, count: 2}
        - {at: 40, type: cache_flush, label: "Redis failed over to an empty node"}
    assertions:
      - {metric: p99_ms, op: lte, value: 200}
      - {metric: error_rate, op: lte, value: 0.8}
  - id: scalper-bots
    name: Scalper bots join the sale
    summary: +9,000 req/s of bot traffic for 30 s during the rush
    hidden: true
    scenario:
      duration: 90
      base_rps: 6000
      read_ratio: 0.9
      static_ratio: 0.6
      cacheable: 0.85
      working_set_gb: 3
      spikes: [{at: 15, duration: 45, multiplier: 3, ramp: 10}]
      events:
        - {at: 35, type: kill_app_instance, count: 2}
        - {at: 30, type: bot_wave, ratio: 1.5, duration: 30, label: "Scalper bots: +9,000 req/s hammering product availability"}
    assertions:
      - {metric: p99_ms, op: lte, value: 110}
      - {metric: error_rate, op: lte, value: 0.6}

hints:
  - Profile before you buy. Run the test and, for each box, ask what share of the traffic it receives actually needs to be there. Start with the 60% that are images and scripts.
  - After the CDN and a cache, size the app tier for the peak by hand (~7,500 units of work at 3×) and check what happens when two instances vanish. Autoscaling alone cannot react to a 10 s ramp when new servers need 20 s to boot. And what does the load balancer do with a dead server?
  - "Users → CDN → LB → Storefront → Redis + PostgreSQL. Turn on health checks, start with ~11 large instances and let autoscaling go higher, give Redis stampede protection and the database a replica for the cold-cache moment. Then think about scalpers: which LB setting stops 9,000 bot requests per second?"

editorial: |
  ### Why it broke
  Every layer was on the critical path and none had headroom. At 3× the starter's storefront
  fleet receives ~18,000 req/s including ~10,800 image requests, so it needs ~3× its capacity
  (**peak 337% busy**). PostgreSQL is asked for every read, several times its ~1,500 units/s, and
  peaks at 168% even though most requests are refused before they reach it. With health
  checks off, the two dead instances keep receiving their share of traffic. **85% of requests
  fail.**

  ### The fix, layer by layer
  | layer | change | effect at 3× |
  |---|---|---|
  | edge | **CDN** for static | 10,800 → ~540 image req/s reach the origin |
  | data | **Redis cache-aside** (4 GB, 300 s TTL) | ~97% of cacheable reads never reach PostgreSQL |
  | data | **PostgreSQL large + 1 replica** | misses, uncacheable reads and orders spread over two nodes: peak ~47% busy |
  | compute | **11 large + autoscaling to 16** | ~7,500 units on 11,000 (~68%); peak 84% after losing 2, until replacements boot |
  | routing | **health checks** | dead instances removed after ~3 s instead of forever |

  Result: **p99 ~70 ms, 0.48% errors** (most of it the 3 s before health checks pull the dead
  servers, plus 0.2% of real users caught by the rate limiter).

  ### Why autoscaling alone is not enough
  Starting at 5 instances with autoscaling, the fleet requests more at t=25, but new servers are
  ready only at t=45. In between, the ramp and the two crashes push it past 100%: about **10%
  errors**. Even starting at 9, losing two instances at t=35 leaves 7 servers at ~108% until the
  replacements boot. Autoscaling handles the *long* rush; **headroom** handles the first minute.

  ### The traps the hidden tests probe
  - **Redis restarts mid-rush.** Every cacheable read misses at once, at peak traffic. Stampede
    protection collapses duplicate misses (~75% fewer queries while cold), and the replica gives
    the database room to absorb the rest: p99 stays ~73 ms, versus ~640 ms without stampede
    protection and ~1.5 s without the replica.
  - **Scalper bots.** +9,000 uncacheable req/s go straight to the storefront and the database. A
    per-client limit of 50 req/s blocks 97% of them while touching 0.2% of shoppers. Without
    it, errors climb to ~13%.

  ### Alternatives and why not
  - **Scale the starter up (no CDN, no cache)**: ~14 large instances (a quarter of their work
    is serving photos) plus an xlarge database: far over budget, and every image still costs a server round trip.
  - **Pre-scale to 16 fixed instances**: works technically, but at ~$3.79/hr it breaks the budget
    and pays for peak capacity all year. Headroom plus autoscaling is cheaper.
  - **Queue checkout writes**: orders are only ~1% of tonight's load; not the bottleneck.

  ### Interview takeaway
  Profile the path and remove work before adding capacity: static to the CDN, repeat reads to
  the cache. Then plan capacity for peak plus failures (N+2), use autoscaling for duration rather
  than for the first spike, and assume the cache, servers and bots will all misbehave at the
  worst moment.
