slug: static-files-choking-the-api
kind: lab
title: Static files are choking the API
difficulty: easy
day: 2
summary: A wallpaper gallery's API spends most of its time serving images and JavaScript. Move static files to a CDN.
topics: [cdn, static-content, edge-caching, load-balancing]
company_tags: [Pinterest, Cloudflare]
estimated_minutes: 15
incident: "SEV-2 · 88% of requests failing on Wallgrove · API CPU 141% · 92% of traffic is /static"

brief_beginner: |
  You run **Wallgrove**, a site where people browse and download phone wallpapers. Every page is
  mostly pictures: a single visit loads one small piece of data (the list of wallpapers) and a dozen
  images, icons and script files.

  Right now **every** one of those requests goes to your own API servers. Out of **9,000 requests
  per second**, about **92%** are for those files, which never change and are the same for every
  visitor. Your four servers spend most of their effort handing out the same pictures over and over,
  and the real work (search, favourites, uploads) is stuck in the queue behind them. Most visitors
  get an error.

  Imagine a restaurant where the chef also walks out to pour every glass of water. You would not hire
  more chefs. You would put a water jug by the door so guests help themselves, and let the chef cook.
  A **CDN** is that jug: copies of your files sitting in data centres close to your users.

  **Your job:** get the images and scripts off your servers so they only handle the requests that
  actually need them, without blowing the budget on extra servers.

brief_expert: |
  9k rps, 92% static (images, JS bundles, CSS; immutable, versioned URLs), 8% dynamic (85% reads).
  Static costs 0.25 units on the app tier, dynamic ~1.05, so static is ~70% of the ~2.8k units
  landing on 4 × medium (2k units). The tier is saturated, threads are exhausted, and dynamic traffic
  is collateral damage. PostgreSQL is ~50% busy and is not the issue.

  Offload static to an edge CDN (Users → CDN → LB, ~95% edge hit ratio, origin sees the misses). The
  CDN has a per-request cost, so compare it with scaling the app tier to ~7–8 instances; the budget
  only fits one of those.

glossary:
  - term: Static file
    meaning: A file that is the same for every user and rarely changes, such as an image, a font or a JavaScript bundle.
  - term: CDN
    meaning: Content delivery network. Servers spread around the world that keep copies of your static files and serve them close to users.
  - term: Edge
    meaning: The CDN location nearest to a user. Serving from the edge means the request never reaches your own servers.
  - term: Origin
    meaning: Your own servers, where the CDN fetches a file the first time (or when its copy expires).

requirements:
  - p99 latency under 40 ms at 9,000 req/s
  - Error rate under 0.5%
  - Stay within $0.88/hr (doubling the API fleet does not fit)

budget: 0.88
