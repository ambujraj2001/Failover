hints:
  - Run the test and open the API node. It is overloaded, but look at what kind of requests make up most of its traffic.
  - Those images and scripts are identical for every visitor and never change. Is there a component that can answer them before they ever reach your load balancer?
  - Add a CDN and route Users → CDN → Load Balancer (remove the direct Users → Load Balancer edge). The CDN answers about 95% of static requests at the edge and forwards everything else. Then check whether you still need every API instance.

editorial: |
  ### Why it broke
  Of **9,000 req/s**, about **8,280** are static files and **720** are real API calls. Serving a file
  is cheap (0.25 units) but there are so many of them that they add up to about **2,070 units/s**,
  versus roughly **750** for the API calls. Four medium instances can do **2,000 units/s**, so the
  tier runs at **141%**: requests queue, worker threads fill up, and **88% of requests fail**. The
  database is only about half busy, so it is not the cause.

  ### The fix: put a CDN in front
  ```
  Users → CDN ──(95% of static served at the edge, ~6 ms)
           └──→ Load Balancer → API × 4 → PostgreSQL   (dynamic + 5% static misses)
  ```
  The API now sees about **750 units** of real work plus **~100 units** of static misses: roughly
  **43%** busy. p99 falls to about **32 ms** with no errors, for **$0.80/hr**. Most of that new cost
  is the CDN's per-request fee, which is still cheaper than the servers it replaces.

  ### The trap: headroom you no longer think about
  The hidden tests add a 30% traffic rise and kill an API instance mid-run. With the CDN in place both
  are easy: even three instances would survive. Without it, every extra visitor lands on the API four
  times over (one page, many files).

  ### Why not just add servers?
  You need about **7–8 medium instances** to carry the static traffic yourself, which costs around
  $0.90–1.00/hr with the extra load balancer traffic, over budget, and the six that do fit run at 94% busy (p99 ≈ 180 ms).
  More servers also do nothing for users far from your data centre, while a CDN serves them from a
  nearby edge. Other options exist in real life (object storage behind the CDN as the origin, longer
  `Cache-Control` headers with versioned file names), but the core move is the same: never let your
  application servers hand out immutable bytes.

  ### Interview takeaway
  Split traffic by type before scaling anything. Static and media go to a CDN with long cache
  lifetimes and versioned URLs; the app tier only handles dynamic requests. Count requests per page
  view, not just page views.
